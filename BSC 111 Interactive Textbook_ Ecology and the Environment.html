<style>

CH.push({
id:'ch01',num:1,period:1,weeks:'Week 2',
title:'Environmental Science, Ecology, and Ethics',short:'Science, ecology, ethics',
blurb:'Three words that sound alike but mean different things, a shared definition of sustainability, and the numbers that explain why it matters now.',
objectives:[
 'Differentiate {{environmentalism}}, {{environmental science}}, and {{ecology}}.',
 'Define {{environmental sustainability}} and the {{triple bottom line}}.',
 'Explain {{ecological footprint}} and what it means that humanity is using more than Earth can renew.',
 'Name the major causes of environmental problems.',
 'Describe your own environmental ethic and what you value about the environment.'

sections:[
{id:'words',title:'Environmentalism, environmental science, and ecology',html:`
<p>These three terms get used as if they were interchangeable. In this course they are not, and exam questions will test the difference.</p>
<table><tr><th>Term</th><th>What it is</th><th>Is it a science?</th></tr>
<tr><td>{{Environmentalism}}</td><td>A concern for the environment. It is often rooted in aesthetic, moral, pragmatic, or religious beliefs.</td><td>Not necessarily</td></tr>
<tr><td>{{Environmental science}}</td><td>The scientific study of how human actions influence natural processes. It pulls from economics, sociology, politics, law, physics, chemistry, and ecology.</td><td>Yes, and interdisciplinary</td></tr>
<tr><td>{{Ecology}}</td><td>The study of the distribution of species and how they interact with their environment.</td><td>Yes, a branch of biology</td></tr></table>
<p>The word <i>ecology</i> comes from the Greek <i>oikos</i>, meaning "house." Ecologists study the household we all live in: who lives where, and how organisms and their surroundings depend on each other.</p>
<div class="co watch"><h4>Common mistake</h4><p>Do not describe environmentalism as "the science of the environment." Someone can care deeply about forests for spiritual reasons and be an environmentalist without doing any science. Environmental science is the evidence-based study of human influence on nature.</p></div>`},
{id:'ethics',title:'Environmental ethics and values',html:`
<p>Your {{environmental ethic}} is your personal answer to three questions: how do you define your own environmental ethic, what do you value about the environment, and why? There are no wrong answers to these, but the reasons matter. Values come from somewhere: family, culture, faith, experience outdoors, education.</p>
<p>The "seven generation" idea is one well-known way to put an ethic into practice: make decisions by asking how they will affect people seven generations from now. It is often associated with the Haudenosaunee (Iroquois) Confederacy, whose Onondaga Nation is based near Syracuse.</p>
<div class="co key"><h4>Key idea</h4><p>As keepers of the planet, do humans have a duty to protect places of value? Whether you answer yes or no, you should be able to say why. Ethics is where science meets the question "what should we do?"</p></div>`},
{id:'sustain',title:'Environmental sustainability',html:`
<p>You will see many definitions of sustainability. When you compare them, ask where each one comes from, how they overlap, and why they differ. The definition used in this course:</p>
<div class="co key"><h4>Our definition</h4><p><b>Environmental sustainability</b> is the use of the Earth and its resources in such a way that resources will be available for us, for other organisms, and for future generations. Put another way: live and use natural resources today without compromising the needs of those who follow.</p></div>
<h3>The triple bottom line</h3>
<p>Sustainability only works when three goals are balanced at the same time:</p>
<ul><li><b>Environmental awareness</b></li><li><b>Social well-being</b></li><li><b>Economic growth</b></li></ul>
<p>You will see this idea return in the food chapter, where a government has to balance people, planet, and profit.</p>
<h3>Natural capital</h3>
<p>{{Natural capital}} is the sum of the natural resources (food, water, wood, energy, medicines) and natural services (air and water purification, soil fertility, waste disposal, pest control) that sustain life and our economies. Sustainability means living off the "interest" without spending down the capital.</p>`},
{id:'why',title:'Why this matters, even if this is not your major',html:`
<p>Students sometimes ask: "I am not a major in this field. Why am I learning this?" Because everyone eats, drinks water, breathes air, uses energy, votes, and buys things. Three facts frame the answer.</p>
<h3>We live in an exponential age</h3>
<p>Human population growth follows a <b>J-shaped curve</b>: growth that accelerates because the amount added each year is a percentage of an ever larger base. You will practice the math for this in Chapter 7.</p>
<h3>Wild places are shrinking into islands</h3>
<p>Roughly <b>35%</b> of U.S. land is protected in some form (parks, preserves, forests, refuges), but most of it is in Alaska and the western states. Are these areas becoming "islands" surrounded by human encroachment and sprawl?</p>
<h3>We are an urban nation</h3>
<p>About <b>8 of every 10 Americans</b> live in urban areas, and about 48% live in consolidated metropolitan areas. As we move to cities, we lose daily contact with wilderness and the values attached to it.</p>`},
{id:'causes',title:'Causes of environmental problems',html:`
<p>Environmental scientists group the roots of our problems into seven major causes:</p>
<ol><li>Population growth</li><li>Habitat loss and degradation</li><li>Wasteful resource use</li><li>Poor environmental accounting (the true costs of resources are not in their prices)</li><li>Ecological ignorance</li><li>Natural capital degradation</li><li>Poverty</li></ol>
<div class="co key"><h4>Key idea</h4><p>The causes are linked. Poverty can push people to overuse land; poor accounting hides the cost of wasteful use; ignorance keeps us from noticing the damage. Solutions have to work on several causes at once.</p></div>`},
{id:'footprint',title:'Ecological footprint',html:`
<p>An {{ecological footprint}} is the amount of biologically productive land and water needed to supply an area (a person, a city, a country) with resources <b>and</b> to absorb the wastes and pollution left behind by that resource use. Both halves count: what you take and what you leave.</p>
<p>Compare humanity's footprint with Earth's <b>ecological capacity</b>, which is how much the planet can renew and absorb. By 2002 the average human footprint was about 39% higher than Earth's capacity. Using more than Earth can regenerate is called <b>overshoot</b>: it is possible for a while by drawing down natural capital, but not forever.</p>
<div class="co local"><h4>Where you come in</h4><p>You will calculate your own footprint in the Ecological Footprint assignments (Weeks 2 and 14). As you read the rest of this book, watch for the choices that shrink or grow it: energy, food, water, waste, and transportation.</p></div>`}
],

title:'The Scientific Method and Peer Review',short:'Scientific method',
blurb:'How scientists turn curiosity into knowledge, why a hypothesis is "supported" and never "proven," and how peer review keeps the process honest.',
objectives:[
 'Describe science as a looping process, not a straight line.',
 'Order the steps of the {{scientific method}} and explain what a good {{hypothesis}} does.',
 'Explain why hypotheses are supported rather than proven, and what a {{scientific theory}} is.',
 'Explain why {{peer review}} matters and how to read a scientific article.',

sections:[
{id:'what',title:'What science is',html:`
<p><b>Science</b> is the process by which we gain knowledge in order to understand natural processes. It is dynamic and loops back on itself:</p>
<ul><li>Curiosity leads to exploration.</li><li>Rigorous testing refines ideas.</li><li>Community feedback strengthens them.</li><li>The resulting knowledge fuels technology, solutions, and new research questions.</li></ul>
<p>In diagram form: <b>Observations</b> lead to <b>Testing and experimentation</b>, which lead to <b>Explanation and verification</b>, which build <b>Scientific theory</b> and <b>Scientific understanding</b>. Then new observations start the cycle again.</p>`},
{id:'steps',title:'The steps of the scientific method',html:`
<p>The method is a pattern of reasoning more than a rigid checklist, but these seven steps describe it well. Try ordering them yourself before you read on.</p>
<div data-widget="order" data-name="sci" data-title="Order the scientific method" data-sub="Put the seven steps in sequence."></div>
<h3>The hypothesis</h3>
<p>A {{hypothesis}} is a testable explanation that makes a prediction, often written as "If... then..." Hypotheses cannot be scientifically proven true. They are accepted for as long as the available evidence supports them. Scientists test hypotheses with <b>controlled experiments</b> and with <b>mathematical models</b>.</p>
<div class="co watch"><h4>Supported, not proven</h4><p>After a successful experiment we say the hypothesis is <b>supported</b>. A single experiment cannot rule out every other explanation, and future evidence could still contradict it. "Proof" belongs to mathematics. A drug trial that beats a placebo supports the hypothesis that the drug reduces symptoms. It does not prove the drug works in every case, and effect size, other populations, and replication still matter.</p></div>
<h3>Everyday science</h3>
<table><tr><th>Step</th><th>Car repair</th><th>Spaghetti sauce</th></tr>
<tr><td>Observation</td><td>The engine will not turn over.</td><td>Sauce should be red.</td></tr>
<tr><td>Hypothesis (prediction)</td><td>The battery is dead.</td><td>Try a tomato sauce.</td></tr>
<tr><td>Test</td><td>Replace the battery.</td><td>Heat a pot of tomato sauce.</td></tr>
<tr><td>Observe results</td><td>The engine turns over.</td><td>It tastes bland.</td></tr>
<tr><td>Revise?</td><td>Not needed.</td><td>Add garlic. Taste again: better.</td></tr>
<tr><td>Theory / conclusion</td><td>Cars will not start without a charged battery.</td><td>The final recipe.</td></tr></table>
<p>Non-scientific explanations ("aliens drained the battery," "the gods are angry") cannot be tested, so there is no way to find out if they are wrong. Testability is what makes an idea scientific.</p>`},
{id:'theory',title:'Theory, in the scientific sense',html:`
<p>In everyday talk, "theory" means a guess. In science a {{scientific theory}} is a well-substantiated explanation of nature, built on a large body of evidence. The things scientists are <i>most</i> certain about are theories. Evolution and the germ theory of disease are examples.</p>
<div class="co key"><h4>Key idea</h4><p>Hypothesis: a testable proposed explanation. Theory: an explanation that has survived many tests from many directions. A theory does not "graduate" from a hypothesis by being proven; it earns its status by accumulating support.</p></div>`},
{id:'review',title:'Peer review and reading the literature',html:`
<p>{{Peer review}} is the formal check in which other scientists evaluate whether a study's methods really test its hypothesis, before the work is published. Every peer-reviewed article you read follows the same core logic as the experiments above: an observation, a testable hypothesis, and a method built to test it.</p>
<p>To find articles, search a scholarly database such as Google Scholar for a course topic, scan the abstract, and ask two questions: what was the main finding, and what is one interesting highlight? The Canvas guidelines show how.</p>
<div class="co key"><h4>Why peer review matters</h4><p>It is the community-feedback step in the loop. Reviewers catch weak methods, unsupported conclusions, and missing controls, which makes published findings more trustworthy than a blog post or an unreviewed claim.</p></div>`},
{id:'lab',title:'Science in practice: the ants lab',html:`
<p>The ant ecology lab practices the whole method. You make observations of ant behavior and feeding, state a hypothesis, and design an experiment with ant baits on index cards: honey (carbohydrates), canned tuna (proteins), and peanut butter (complex foods). You replicate the experiment twice and analyze the data across different habitats.</p>
<h3>Parts of a lab report</h3>
<ul><li><b>Introduction:</b> at least two paragraphs on subject, purpose, and background.</li><li><b>Materials and methods:</b> in list format.</li><li><b>Hypotheses:</b> every one, in complete sentences.</li><li><b>Procedure:</b> a recipe-style list of exactly what you did.</li><li><b>Results:</b> complete sentences plus figures or tables.</li><li><b>Conclusions and discussion:</b> two or three paragraphs on what you found and what it implies.</li></ul>`},
{id:'integrity',title:'Using sources honestly',html:`
<p>Science runs on trust, so how you use other people's work matters. {{Plagiarism}} is presenting someone else's words or ideas as your own. Work through these cases:</p>
<table><tr><th>Situation</th><th>Plagiarism?</th></tr>
<tr><td>Copying a paragraph word for word with no citation</td><td>Yes. A clear case.</td></tr>
<tr><td>Copying a paragraph word for word <i>with</i> a citation, but no quotation marks</td><td>Yes. Using someone's exact words requires quotation marks. Direct quotes are rarely used in scientific papers.</td></tr>
<tr><td>Rephrasing someone else's information without citing the source</td><td>Yes. You took the ideas even if not the words.</td></tr>
<tr><td>Rephrasing and reassembling facts to support your own thesis, citing every source</td><td>No. This is the method to use.</td></tr></table>
<p>Start assignments early so you are never tempted to take a shortcut. For graded work, follow the course policy on AI use and collaboration; the syllabus and each assignment spell out what is allowed.</p>`}
],

title:'Matter, Energy, and Earth\'s Spheres',short:'Matter, energy, spheres',
blurb:'The chemistry and physics you need for the rest of the course: atoms, isotopes, ions, forms of energy, the two energy laws, and how matter cycles through Earth\'s connected spheres.',
objectives:[
 'Define {{matter}}, {{element}}, {{atom}}, {{molecule}}, and {{compound}}.',
 'Use the {{atomic number}} and {{atomic mass}} to count protons, neutrons, and electrons.',

sections:[
{id:'matter',title:'Matter, atoms, and molecules',html:`
<p>{{Matter}} is anything that has mass: solids, liquids, gases, and plasma. All matter is built from {{elements}}, the distinctive building blocks such as carbon, copper, sodium, and hydrogen. The smallest unit of an element is an {{atom}}, and every atom is unique to its element. The periodic table organizes all the elements.</p>
<p>A {{molecule}} is two or more atoms (of the same or different elements) held together by chemical bonds, such as O<sub>2</sub>, N<sub>2</sub>, O<sub>3</sub>, and H<sub>2</sub>O. The subscripts tell how many atoms of each element are in the molecule. A {{compound}} is a molecule made of two or more <i>different</i> elements held together in fixed proportions, such as H<sub>2</sub>O, CO<sub>2</sub>, and N<sub>2</sub>O.</p>
<div class="co watch"><h4>Common mistake</h4><p>O<sub>2</sub> is a molecule but not a compound, because both atoms are the same element. H<sub>2</sub>O is both a molecule and a compound.</p></div>`},
{id:'atoms',title:'Inside the atom',html:`
<table><tr><th>Particle</th><th>Charge</th><th>Contribution to mass number</th></tr>
<tr><td>{{Proton}}</td><td>Positive</td><td>1</td></tr>
<tr><td>{{Neutron}}</td><td>Neutral</td><td>1</td></tr>
<tr><td>{{Electron}}</td><td>Negative</td><td>0 (mass is negligible)</td></tr></table>
<p>Protons and neutrons sit in the small, dense {{nucleus}} at the center. The {{atomic number}} is the number of protons, and it defines the element (hydrogen has 1 proton; carbon has 6). The {{atomic mass}} is protons plus neutrons.</p>
<div class="co math"><h4>Worked example</h4><p>An atom has 2 electrons, 2 protons, and 2 neutrons. Its atomic number is <b>2</b> (the protons). Its atomic mass is <b>4</b> (2 protons + 2 neutrons). It is helium.</p></div>
<h3>Isotopes and ions: change one thing</h3>
<ul><li>An {{isotope}} changes the number of <b>neutrons</b>. Protons stay the same, so it is still the same element, but the atomic mass changes. Carbon with 6 protons and 7 neutrons has an atomic mass of 13.</li>
<li>An {{ion}} changes the number of <b>electrons</b>. Protons stay the same, so it is still the same element, but now it carries an electric charge.</li></ul>
<div data-widget="isotope"></div>
<div class="co math"><h4>Try this one</h4><p>A mystery atom has 5 electrons and an atomic mass of 9, and it is an ion with 1 <i>more</i> electron than normal. A neutral atom would have only 4 electrons, so it has <b>4 protons</b>. The atomic number is 4 (beryllium). Neutrons = 9 minus 4 = <b>5</b>. Electrons = <b>5</b>.</p></div>`},
{id:'energy',title:'Energy and its two laws',html:`
<p>{{Energy}} is the capacity to do work and transfer heat. It comes in several forms:</p>
<ul><li>{{Potential energy}}: stored energy with the possibility of doing work, like a book on a desk or water behind a dam.</li>
<li>{{Kinetic energy}}: energy in motion, doing work and transferring heat, like wind, a falling book, or heat radiating from a stove.</li>
<li>{{Electromagnetic radiation}}: energy in wave form, produced by moving electrically charged particles. Waves with <b>shorter wavelengths carry more energy</b> than waves with longer wavelengths.</li></ul>
<h3>The laws of thermodynamics</h3>
<ol><li>{{First law of thermodynamics}}: energy cannot be created or destroyed, only converted from one form to another.</li>
<li>{{Second law of thermodynamics}}: whenever energy changes form, some of it is converted to lower-quality, less useful energy (usually heat).</li></ol>
<div class="co key"><h4>Why these laws keep coming back</h4><p>The second law explains why only about 10% of energy passes from one trophic level to the next (Chapter 4), why fossil fuel power plants waste so much energy (Chapter 14), and why we can never recycle energy the way we recycle matter.</p></div>`},
{id:'spheres',title:'The spheres and biogeochemical cycles',html:`
<p>Earth works as a set of connected parts called spheres: the <b>atmosphere</b>, <b>hydrosphere</b>, <b>cryosphere</b>, <b>biosphere</b>, and <b>geosphere</b>. Two big ideas link them:</p>
<ul><li><b>Matter recycles.</b> Materials like water and nutrients move and are reused as they cycle among the spheres.</li><li><b>Energy flows.</b> Energy moves through the Earth system, powering changes and interactions across the spheres.</li></ul>
<p>{{Biogeochemical cycles}} are the continuous natural pathways that move essential elements (carbon, nitrogen, oxygen, phosphorus, sulfur, and hydrogen) between living organisms and the nonliving environment (atmosphere, lithosphere, hydrosphere). They are driven by solar energy and geological processes, and they recycle the nutrients life needs.</p>
<h3>Reservoirs and exchange pools</h3>
<ul><li><b>Reservoir pool:</b> large, slow, and usually nonliving (abiotic).</li><li><b>Exchange pool:</b> smaller and faster, where elements move between living and nonliving parts.</li></ul>
<table><tr><th>Type</th><th>Reservoir</th><th>Examples</th></tr>
<tr><td>Gaseous cycles</td><td>Air or oceans</td><td>Nitrogen, oxygen, carbon, water</td></tr>
<tr><td>Sedimentary cycles</td><td>Earth\'s crust</td><td>Iron, calcium, phosphorus, sulfur</td></tr></table>
<h3>When people disrupt a cycle</h3>
<p>Wildfires, floods, climate shifts, and pollution can all disrupt a cycle, moving materials too fast, too slow, or to the wrong place. Humans do this by burning fuels, changing land use, and polluting. When we do, we destabilize the natural balance ecosystems rely on, which is exactly what our definition of sustainability warns against.</p>`}
],

<script>
CH.push({
id:'ch04',num:4,period:1,weeks:'Week 5',
title:'Ecosystems: How They Work',short:'Ecosystems',
blurb:'Who eats whom, where the energy goes, and why one male Florida panther needs about 110 square miles of connected habitat.',
objectives:[
 'Place populations, communities, and ecosystems in the ecological hierarchy.',
 'Distinguish {{producers}}, {{consumers}}, {{decomposers}}, and {{detritivores}} and trace a {{food chain}} and {{food web}}.',
 'Explain the 10% rule and what happens to the other 90% of energy.',
 'Define {{net primary production}} and name the most and least productive ecosystems.',
 'Describe how humans alter the carbon, nitrogen, and hydrologic cycles.',
 'Use ecosystem concepts to explain the habitat needs of the Florida panther.'
],
sections:[
{id:'hier',title:'The ecological hierarchy',html:`
<p>{{Ecology}} is a study of connections: how organisms interact with each other and with their nonliving surroundings. Ecologists organize life into levels:</p>
<ul><li><b>Species:</b> organisms classified by shared characteristics. About 1.4 million species are known; scientists estimate there may be 4 to 100 million. Insects dominate the known count (about 751,000), followed by other animals, plants, fungi, protists, and prokaryotes.</li>
<li>{{Population}}: a group of interacting individuals of the same species in a specific area. The space they normally occupy is their {{habitat}}.</li>
<li>{{Community}}: all the populations of different species living and interacting in an area.</li>
<li>{{Ecosystem}}: a community <i>plus</i> its nonliving (abiotic) environment, linked by energy flow and nutrient cycling.</li>
<li><b>Biosphere:</b> all of Earth\'s ecosystems together.</li></ul>
<div class="co watch"><h4>Community versus ecosystem</h4><p>A community is only the living populations. An ecosystem adds the nonliving parts such as sunlight, water, temperature, and nutrients.</p></div>
<p>Ecosystems have {{abiotic factors}} (nonliving: sun, water, soil, temperature) and {{biotic factors}} (living: plants, animals, microbes). The availability of matter and energy resources limits how many organisms a population can have.</p>`},
{id:'feeding',title:'Producers, consumers, and decomposers',html:`
<p>The Sun powers nearly everything. Solar energy warms the atmosphere, evaporates and recycles water, generates winds, and supports plant growth.</p>
<ul><li>{{Producers}} (plants, algae) capture sunlight and make carbohydrates by {{photosynthesis}}. Chlorophyll in chloroplasts absorbs the solar energy. Producers are the basic source of all food.</li>
<li>{{Consumers}} (heterotrophs) get food by eating other organisms or their remains.
 <ul><li>Herbivores are primary consumers that eat producers.</li><li>Carnivores are secondary consumers that eat primary consumers; third and higher-level consumers eat other carnivores.</li><li>Omnivores eat both plants and animals.</li></ul></li>
<li>{{Decomposers}} break down dead material and recycle nutrients. {{Detritivores}} (insects and other scavengers) feed on wastes and dead bodies.</li></ul>
<p>A {{food chain}} shows one path of energy: who eats whom. A {{food web}} shows all the interconnected chains. Each step is a {{trophic level}}.</p>`},
{id:'energy',title:'Energy flow and the 10% rule',html:`
<p>An ecosystem survives through a combination of <b>energy flow</b> and <b>matter recycling</b>. Matter is recycled, but energy is lost along the way, in line with the {{second law of thermodynamics}}.</p>
<p>Under {{ecological efficiency}}, only about <b>10%</b> of the energy at one trophic level is passed to the next. The other 90% is used for the organism\'s own life processes (respiration) and given off as heat, or is never eaten or digested. That is why:</p>
<ul><li>food chains are short, usually three to five links;</li><li>there is far more biomass of plants than of herbivores, and far more herbivores than carnivores;</li><li>top predators need large areas to find enough food.</li></ul>
<div data-widget="pyramid"></div>`},
{id:'npp',title:'Net primary production',html:`
<p>{{Net primary production}} (NPP) is the rate at which an ecosystem\'s producers convert solar energy into chemical energy as biomass, <b>minus</b> the energy they use for their own respiration. It tells you how much life you can expect to find in a given location.</p>
<p>Nature\'s most productive systems include estuaries and coral reefs (along with swamps and marshes and tropical rainforests). The least productive include deserts and the open ocean. The open ocean covers a vast area but is like a desert: only places like estuaries and reefs are extremely productive. Precipitation influences NPP, which connects to the water chapter.</p>`},
{id:'cycles',title:'Recycling matter and how we alter it',html:`
<p>{{Nutrients}} are the elements and compounds organisms need to live, grow, and reproduce. Global {{biogeochemical cycles}} move them through air, water, soil, rock, and living things. Three you should know:</p>
<table><tr><th>Cycle</th><th>How humans alter it</th></tr>
<tr><td>Carbon</td><td>Add excess CO<sub>2</sub> by burning fossil fuels and by clearing vegetation faster than it is replaced.</td></tr>
<tr><td>Nitrogen</td><td>Add gases that contribute to acid rain; add nitrous oxide (which warms the atmosphere and depletes ozone); contaminate groundwater with fertilizer; release nitrogen through deforestation.</td></tr>
<tr><td>Hydrologic (water)</td><td>Withdraw large amounts of freshwater; clear vegetation and erode soil; pollute surface water and groundwater.</td></tr></table>`},
{id:'panther',title:'Case study: the Florida panther',html:`
<p>The Florida panther (<i>Puma concolor coryi</i>) is threatened with extinction because development has taken its habitat. Why does one male need about <b>110 square miles</b> of continuous habitat?</p>
<div class="co case"><h4>Connect the concepts</h4>
<ul><li><b>Trophic pyramid and ecological efficiency:</b> a top predator sits where only a sliver of the original solar energy arrives, so it needs a lot of prey over a lot of land.</li>
<li><b>Habitat selection follows prey availability,</b> which is the panther\'s energy supply.</li>
<li><b>Large contiguous areas</b> are needed for social, reproductive, and energetic needs. Fragmented habitat cuts those off.</li>
<li><b>Limiting factors:</b> habitat availability, prey availability, and lack of human tolerance.</li></ul></div>
<p>This is why wildlife corridors, connected strips of habitat that let animals move between larger areas, are central to panther conservation.</p>`},
{id:'bio',title:'Biodiversity at a glance',html:`
<p>Human activities are causing a loss of {{biodiversity}}. Its four components are <b>species diversity, genetic diversity, ecological (ecosystem) diversity, and functional diversity</b>. Chapter 5 takes this up in depth. For now, remember the memory aid <b>HIPPO</b> for the causes: Habitat destruction, Invasive species, Pollution, Population growth, Overexploitation. Natural capital is natural resources plus natural services, both of which biodiversity supplies.</p>`}
],
terms:[
 ['Population','A group of interacting individuals of the same species occupying a specific area.'],
 ['Habitat','The space an individual or population normally occupies.'],
 ['Community','All the populations of different species living and interacting in an area.'],
 ['Ecosystem','A community of living organisms (biotic) together with their nonliving (abiotic) environment, connected by energy flow and nutrient cycling.'],
 ['Abiotic factors','The nonliving components of an ecosystem: sunlight, water, soil, temperature, nutrients.'],

 ['Producers','Organisms (plants, algae) that make their own food, mostly by photosynthesis. The basic source of all food.'],
 ['Photosynthesis','The process by which producers use chlorophyll to capture solar energy and make carbohydrates.'],
 ['Consumers','Heterotrophs that get food by eating all or parts of other organisms or their remains: herbivores, carnivores, omnivores.'],
 ['Decomposers','Organisms that break down dead material and recycle nutrients in ecosystems.'],
 ['Detritivores','Insects and other scavengers that feed on wastes or dead bodies.'],
 ['Food chain','A single path showing who eats whom and how energy moves through trophic levels.'],
 ['Food web','All the interconnected food chains in an ecosystem.'],
 ['Trophic level','An organism\'s feeding position in a food chain: producer, primary consumer, secondary consumer, and so on.'],
 ['Ecological efficiency','The percentage of energy passed from one trophic level to the next. Typically about 10%.'],
 ['Net primary production','The rate at which producers convert solar energy to chemical energy as biomass, minus the energy they use in respiration. Indicates how much life a location can support.'],
 ['Nutrients','Elements and compounds organisms need to live, grow, and reproduce.']
],

 {q:'In a food chain, which organisms are the primary consumers?',o:['Plants','Herbivores','Carnivores that eat carnivores','Decomposers'],a:1,w:'Producers are first. Herbivores eat producers and are the primary consumers.'},

 {q:'Why are food chains usually short?',o:['Predators do not like to eat other predators','Energy is lost at each level, so too little remains to support many more levels','Decomposers eat the top predators','Plants cannot support herbivores'],a:1,w:'Because of the second law of thermodynamics and the 10% rule, little energy is left after a few levels.'},

 {q:'Which human activity alters the carbon cycle?',o:['Burning fossil fuels and clearing vegetation faster than it regrows','Adding fertilizer only','Withdrawing groundwater','Building dams'],a:0,w:'Both add excess CO2 to the atmosphere. Fertilizer is tied to the nitrogen cycle and groundwater withdrawal to the hydrologic cycle.'},
 {q:'Why does a male Florida panther need so much continuous habitat?',o:['Panthers like to travel for fun','As a top predator it sits where little energy remains, so it needs large areas with enough prey and room for social and reproductive needs','Because it eats producers','Because decomposers are scarce'],a:1,w:'Trophic position, energy efficiency, prey availability, and need for contiguous space all explain the large range.'}
],

CH.push({
id:'ch05',num:5,period:1,weeks:'Week 6',
title:'Evolution and Biodiversity',short:'Evolution, biodiversity',
blurb:'Over 3 billion years of evolution produced the variety of life we depend on. We are now losing it in decades, far faster than evolution can replace it.',
objectives:[
 'Define {{evolution}} and explain how {{natural selection}} produces {{adaptation}}.',
 'Name the three conditions necessary for evolution by natural selection.',
 'Explain {{speciation}} and {{extinction}}, and describe the mass extinctions.',
 'List the four components of {{biodiversity}} and explain what a {{biodiversity hot spot}} is.',

],
sections:[
{id:'time',title:'Deep time',html:`
<p>The Earth is about 4.6 billion years old. Life arose roughly 3.7 billion years ago, after about a billion years of chemical change that produced the first cells. If Earth\'s history were one day starting at midnight:</p>
<table><tr><th>Event</th><th>Clock time</th></tr>
<tr><td>First signs of life</td><td>3 AM</td></tr><tr><td>Complex organisms</td><td>10 PM</td></tr><tr><td>Dinosaurs</td><td>11:20 PM</td></tr><tr><td>Mammals</td><td>11:40 PM</td></tr><tr><td>Humans</td><td>11:59 PM</td></tr></table>
<p>We are primates. The human lineage diverged from other primates 5 to 8 million years ago, and our closest relative is the chimpanzee. Using the lecture figures, human and chimpanzee DNA is about 98.8% identical (estimates vary with method), and the DNA of two humans is about 99.9% similar.</p>`},
{id:'evo',title:'Evolution and natural selection',html:`
<p>{{Evolution}} is a change in the traits of a <b>population</b> of organisms across generations. It happens by {{natural selection}}: organisms with favorable traits are more likely to survive and reproduce than others, which leads to {{adaptation}} and {{speciation}}. Darwin published the idea in 1859.</p>
<div class="co watch"><h4>Common mistake</h4><p>Individuals do not evolve during their lifetimes. A single organism changing during its life is not evolution. Populations evolve, through changes in their genetic makeup over successive generations.</p></div>
<h3>Three conditions are necessary</h3>
<ol><li><b>Genetic variability:</b> individuals differ.</li><li><b>Heritable traits:</b> the differences can be passed to offspring.</li><li><b>Differential reproduction:</b> the trait leads some individuals to leave more offspring.</li></ol>
<p>An <b>adaptive trait</b> is any heritable trait that helps an organism survive and reproduce better under current environmental conditions. Evolution is also a scientific theory: a well-substantiated explanation based on a large body of evidence. That is very different from the everyday meaning of "theory" as a guess.</p>
<h3>Speciation and extinction</h3>
<p>{{Speciation}} occurs when members of a population are isolated for a long time. Their genetic makeup diverges until they could not produce fertile offspring with the original population even if reunited. {{Extinction}} occurs when a population cannot adapt to changing conditions. The golden toad of Costa Rica\'s Monteverde cloud forest went extinct because of climate change.</p>`},
{id:'mass',title:'Mass extinctions',html:`
<p>Fossils show five major mass extinctions over the last 500 million years. Each opened up niches that were later filled during periods of recovery called adaptive radiations, lasting 10 million years or more.</p>
<div class="tw"><table><tr><th>Period</th><th>Approximate loss</th></tr>
<tr><td>Ordovician</td><td>50% of animal families, including many trilobites</td></tr>
<tr><td>Devonian</td><td>30% of animal families</td></tr>
<tr><td>Permian</td><td>90% of animal families, over 95% of marine species</td></tr>
<tr><td>Triassic</td><td>35% of animal families</td></tr>
<tr><td>Cretaceous</td><td>Up to 80% of ruling reptiles (dinosaurs)</td></tr></table></div>
<div class="co key"><h4>The sixth extinction</h4><p>Many scientists say we are in the midst of a sixth mass extinction caused by human activities, with many species expected to disappear within the next 50 to 100 years. Natural recovery takes millions of years.</p></div>`},
{id:'bio',title:'Biodiversity',html:`
<p>{{Biodiversity}} is the number and variety of organisms on the planet, and it is the result of evolution. It has four components: <b>species diversity, genetic diversity, ecological (ecosystem) diversity, and functional diversity</b>.</p>
<p>It is unevenly distributed. More than half of the world\'s species live in tropical rainforests. A single rainforest reserve in Peru has more bird species than all of the United States, and one tree there harbors 43 ant species, about the same as the entire ant fauna of the British Isles.</p>
<h3>Hot spots</h3>
<p>A {{biodiversity hot spot}} is a region of high endemicity and high diversity that has lost at least 70% of its original habitat. Hot spots cover only 1.4% of Earth\'s land area but hold about half of all plant species and 42% of terrestrial vertebrates. The Florida Everglades is one, with 68 endangered species.</p>
<h3>Why it matters</h3>
<ul><li><b>Goods we directly consume:</b> food (at least 80% of the developed world\'s diet originated in tropical rainforest), wood, textiles, pharmaceuticals.</li>
<li><b>{{Ecosystem services}}:</b> soil formation, primary production, nutrient cycling, water purification, climate regulation, aquifer recharge, clean air. (Lecture notes that the Amazon rainforest produces more than 20% of the world\'s oxygen.)</li>
<li><b>Natural heritage:</b> aesthetic, spiritual, cultural, and recreational value, plus {{existence value}}, the worth of something even if we never experience it directly.</li></ul>`},
{id:'loss',title:'Causes of loss and what we can do',html:`
<p>The scientific consensus is that human activities are decreasing Earth\'s biodiversity. Remember <b>{{HIPPO}}</b>:</p>
<ul><li><b>H</b>abitat loss and fragmentation</li><li><b>I</b>nvasive species</li><li><b>P</b>ollution</li><li><b>P</b>opulation growth</li><li><b>O</b>ver-harvesting</li></ul>
<p>Add <b>climate change</b> to the list as well. Because adaptation by natural selection takes thousands to millions of years, but human-caused changes happen in 50 years or less, many species cannot keep up.</p>
<h3>E. O. Wilson\'s priorities</h3>
<ol><li>Preserve hot spots immediately.</li><li>Keep remaining old-growth forests intact.</li><li>Finish mapping biodiversity (land, fresh water, ocean) so conservation can be targeted.</li><li>Restore and protect lakes and river systems.</li><li>Develop a global conservation strategy.</li><li>Make conservation profitable.</li><li>Start restoration projects.</li></ol>
<p>At the broadest level: manage for sustainability by not consuming resources faster than they replenish, supported by a new economic vision.</p>`}
],
terms:[
 ['Evolution','A change in the traits of a population of organisms across generations, occurring by natural selection.'],

],

 {q:'Which set includes the three conditions necessary for biological evolution?',o:['Mutation, migration, extinction','Competition, predation, decomposition','Genetic variability, heritable traits, differential reproduction','Producers, consumers, decomposers'],a:2,w:'Variation must exist, be heritable, and lead to some individuals reproducing more.'},
 {q:'Speciation is most directly described as happening when:',o:['A species suddenly becomes extinct','Individuals learn new behaviors','A population becomes isolated long enough that genetic changes prevent producing fertile offspring with the original population','Two unrelated species merge'],a:2,w:'Long isolation leads to genetic divergence until the populations can no longer interbreed.'},
 {q:'Which statement best describes biodiversity hot spots?',o:['Areas with low diversity that are increasing rapidly','Regions of high endemicity and high diversity that have lost a lot of habitat','Places that contain most of the world\'s deserts','Regions unaffected by human activity'],a:1,w:'Hot spots combine high endemism and diversity with at least 70% habitat loss.'},
 {q:'HIPPO refers to which major causes of biodiversity loss?',o:['Heat increase, ice loss, plankton decline, polar warming, ocean acidification','Habitat loss and fragmentation, invasive species, pollution, population growth, over-harvesting','Hurricanes, industrial accidents, pesticides, poaching, overfishing','Herbivory, infection, predation, parasitism, overcompetition'],a:1,w:'HIPPO = Habitat, Invasive species, Pollution, Population growth, Over-harvesting.'},
 {q:'Hot spots occupy about what fraction of Earth\'s land but house about what share of all plant species?',o:['1.4% of land; about half of plants','50% of land; 1.4% of plants','10% of land; 10% of plants','25% of land; 75% of plants'],a:0,w:'Only about 1.4% of land area holds roughly half of all plant species and 42% of terrestrial vertebrates.'},
 {q:'Which is an ecosystem service rather than a directly consumed good?',o:['Food from rainforest plants','Wood','Water purification','Pharmaceuticals'],a:2,w:'Services are indirect benefits such as water purification, nutrient cycling, climate regulation, and clean air.'},
 {q:'Why is the current extinction crisis especially worrying given how evolution works?',o:['Evolution happens in a few years','Adaptation by natural selection takes thousands to millions of years, but human-caused change happens in 50 years or less','Extinction no longer happens naturally','Natural selection stops operating in modern times'],a:1,w:'The pace of human-driven change outstrips the pace of evolutionary adaptation.'}

reflect:[

 'What does this mean for your own dependence on natural goods, services, and aesthetic pleasures?',

],

 '{{Speciation}} creates diversity; {{extinction}} removes it; five mass extinctions have occurred and a sixth is under way.',

<script>
CH.push({
id:'ch06',num:6,period:1,weeks:'Week 6',
title:'Niches and Population Dynamics',short:'Niches, populations',
blurb:'Every species has a role and a strategy. Niches explain how species share resources, and population dynamics explain why some species boom while others grow slowly.',
objectives:[
 'Define {{niche}} and distinguish {{fundamental niche}} from {{realized niche}}.',
 'Contrast {{generalist}} and {{specialist}} species and explain {{resource partitioning}}.',
 'Define {{carrying capacity}} and identify {{limiting factors}}.',
 'Compare r-selected and K-selected species.',
 'Interpret the three types of survivorship curves.'
],
sections:[
{id:'niche',title:'Niches: a species\' total way of life',html:`
<p>A {{niche}} is the complete role of a species in an ecosystem, its total way of life. It is more than an address. If habitat is where an organism lives, the niche is its occupation: what it eats, who eats it, what conditions it tolerates, and how it competes. A niche includes:</p>
<ul><li>competition within the species ({{intraspecific competition}}) and between species ({{interspecific competition}});</li><li>the resources it uses and its habitat;</li><li>the biotic and abiotic factors it needs or tolerates;</li><li>its position in energy flow: what it consumes and who consumes it.</li></ul>
<p>A useful analogy: in a corporation, the species is the employee, the niche is the job, the habitat is the office space, the community is the department, and the ecosystem is the factory.</p>
<h3>Fundamental versus realized</h3>
<ul><li>{{Fundamental niche}}: the full range of physical, chemical, and biological conditions and resources a species could use without competitors.</li>
<li>{{Realized niche}}: the part it actually uses, because other species limit it. To survive and avoid competition, a species usually occupies only part of its fundamental niche.</li></ul>
<p>The general principle: no two species can occupy exactly the same niche in the same place for long.</p>`},
{id:'gs',title:'Generalists, specialists, and sharing resources',html:`
<p>{{Generalist}} species tolerate a wide range of conditions and have broad niches (a raccoon). {{Specialist}} species tolerate only a narrow range and have narrow niches (the giant panda).</p>
<figure class="fig"><svg viewBox="0 0 420 200" width="420" role="img" aria-label="Two overlapping bell curves: a narrow specialist curve and a broad generalist curve, with the overlap labeled niche overlap">
<line x1="30" y1="170" x2="400" y2="170" stroke="var(--ink2)" stroke-width="2"/>
<path d="M40 170 C80 170 90 40 130 40 C170 40 180 170 220 170" fill="color-mix(in srgb,var(--brand2) 35%,transparent)" stroke="var(--brand2)" stroke-width="2.5"/>
<path d="M150 170 C190 170 230 110 275 110 C320 110 360 170 395 170" fill="color-mix(in srgb,var(--gold) 40%,transparent)" stroke="var(--goldink)" stroke-width="2.5"/>
<text x="130" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Specialist (narrow niche)</text>
<text x="290" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Generalist (broad niche)</text>
<text x="185" y="162" text-anchor="middle" font-size="11" fill="var(--ink)">overlap</text>
<text x="215" y="192" text-anchor="middle" font-size="12" fill="var(--ink2)">Resource use</text></svg>
<figcaption>Where the curves overlap, the two species compete for the same resources.</figcaption></figure>
<h3>Resource partitioning</h3>
<p>{{Resource partitioning}} reduces competition by letting species share a limited resource in different ways. The wading and shore birds of a coastal wetland are the classic example, and you saw it at Corkscrew Swamp: the piping plover eats insects and tiny crustaceans on sandy beaches; the black skimmer seizes small fish at the water surface; the brown pelican dives for fish it spots from the air; the Louisiana heron wades to seize small fish; the avocet sweeps its bill through mud and surface water; the dowitcher probes deep into mud; the oystercatcher pries open shellfish.</p>
<p>Differences in beak shape (<b>morphology</b>) let each species specialize. This is <b>evolutionary divergence</b>: over generations a lineage splits into specialized niches. The honeycreepers of Hawaii and the snail kite with its apple snail prey in the Everglades both show beaks matched to a food resource.</p>
<div class="co case"><h4>Island evolution connection</h4><p>Islands show divergence clearly. When a founder species reaches isolated islands with empty niches, it can split into many specialized descendants, which is also why island species are especially vulnerable to extinction when habitat or niches are disturbed.</p></div>`},
{id:'cc',title:'Carrying capacity and limiting factors',html:`
<p>{{Carrying capacity}} is the maximum number of individuals of a species that the resources in an area can support. Population growth is held in check by {{limiting factors}}: the availability of matter and energy resources such as food, water, space, and nutrients, as well as predation and disease. When a population overshoots its carrying capacity, it usually crashes back.</p>`},
{id:'rk',title:'Reproductive strategies and survivorship',html:`
<p>Species have evolved two broad patterns of reproduction:</p>
<div class="tw"><table><tr><th>{{r-selected species}}</th><th>{{K-selected species}}</th></tr>
<tr><td>Many small offspring</td><td>Fewer, larger offspring</td></tr>
<tr><td>Little or no parental care</td><td>High parental care</td></tr>
<tr><td>Early reproductive age</td><td>Later reproductive age</td></tr>
<tr><td>Generalist niche</td><td>Specialist niche</td></tr>
<tr><td>Early successional (pioneer) species</td><td>Late successional species</td></tr>
<tr><td>High population growth rate</td><td>Lower population growth rate</td></tr>
<tr><td>Cockroaches, dandelions, rodents</td><td>Elephants, humans, long-lived trees</td></tr></table></div>
<h3>Survivorship curves</h3>
<ul><li><b>Type A, early loss:</b> most die young (many offspring, little care, such as oysters or many insects).</li><li><b>Type B, constant loss:</b> individuals die at all ages at a steady rate.</li><li><b>Type C, late loss:</b> most live to old age (few offspring, high care, such as humans and elephants).</li></ul>
<p>Life expectancies vary across species and across human populations.</p>
<div class="co key"><h4>Key idea</h4><p>r-selected species are built to grow fast and recolonize disturbed ground. K-selected species are built to persist near carrying capacity, which makes them more vulnerable when habitat is lost.</p></div>`}
],

sections:[
{id:'growth',title:'Why the rapid growth?',html:`
<p>Human population has grown along a J-shaped exponential curve, especially over the last 200 years. Several developments made this possible:</p>
<ul><li>Our ability to expand into diverse habitats and climates.</li><li>Modern agriculture, which feeds more people per unit of land.</li><li>Sanitation, antibiotics, and vaccines, which control infectious disease and lower death rates.</li><li>Concentrated sources of energy, especially fossil fuels.</li></ul>
<p>Keeping more people alive for longer, combined with increasing resource consumption per person, is what drives environmental degradation. As of the figures in lecture, the world population is about 8.17 billion, the U.S. about 342 million, Florida about 23.5 million, and New York about 20.0 million (2026).</p>`},
{id:'math',title:'Population math',html:`
<h3>Population change</h3>
<p>Population change = (births + immigration) minus (deaths + emigration).</p>
<h3>Fertility</h3>
<ul><li>{{Total fertility rate}}: the estimated average number of children a woman will have during her childbearing years.</li><li>{{Replacement-fertility level}}: the number of children a couple must have to replace themselves. It is slightly higher than 2, because some children die before reproducing.</li></ul>
<p>Birth rates are shaped by many factors: the value of children in the labor force, the cost of having children, availability of pensions, urbanization, education and employment opportunities for women, infant mortality, age at marriage, access to birth control, and cultural or religious beliefs. {{Infant mortality}} (babies who die before their first birthday) is often called the best single indicator of a society\'s quality of life, because it reflects nutrition and health care.</p>
<h3>The Rule of 70</h3>
<p>The {{Rule of 70}} gives the doubling time of anything growing exponentially (population, resource use, money in a savings account):</p>
<div class="co math"><h4>Formula and example</h4><p><b>Doubling time (years) = 70 / percent growth rate.</b></p><p>At 1.23% growth: 70 / 1.23 = about <b>57 years</b>.</p></div>
<div data-widget="poplab"></div>`},
{id:'cap',title:'How many people can Earth support?',html:`
<p>Recall that {{carrying capacity}} is the maximum number of individuals the resources in a given area can support. For humans there are two very different ways to ask the question:</p>
<ul><li>"How many people can the Earth support <i>indefinitely</i>?"</li><li>"What is the <i>optimum sustainable population</i> of the Earth based on the planet\'s {{cultural carrying capacity}}?"</li></ul>
<p>The second question brings in values: what standard of living, what share of wild nature, and what level of consumption we consider acceptable. Technology has raised carrying capacity before, but it cannot repeal limits entirely.</p>
<p>Our footprint is big. We have modified, cultivated, built on, and degraded large areas of natural systems to provide for more people. Two challenges follow: maintain a balance between simplified, human-altered communities and complex natural ones, and slow the rates at which we simplify, homogenize, and degrade nature. That means learning how the Earth works and working with it rather than against it.</p>`},
{id:'urban',title:'Urbanization',html:`
<p>{{Urbanization}} is the conversion of natural landscape to urban use, along with the shift of people from rural areas to cities. Cities are ecosystems too, but highly simplified ones.</p>
<div class="co case"><h4>Brazil</h4><p>The share of Brazil\'s population living in urban areas rose from <b>22%</b> in 1960 to <b>78%</b> in 2000, with about <b>85%</b> projected for 2025. Manaus, in the Amazon Basin, was among the fastest-growing cities in Brazil: about 1.4 million people today, with population doubled since 1960.</p></div>
<div class="co local"><h4>Close to home</h4><p>Florida\'s population has grown on average about 2.5 times as fast as the whole U.S., and most of that growth is migration rather than births. A projected 2060 population near 36 million raises the question of whether current development patterns can leave room for natural landscapes and wildlife. New York has a very different density map: people are concentrated in the New York City region and in a few upstate cities, with large, lightly populated areas such as the Adirondacks.</p></div>
<h3>Age structure diagrams</h3>
<p>An age structure diagram shows how many people are in each age group. A wide base (many young people) points toward fast future growth; a narrower base points toward slower growth or decline. The Hans Rosling talk "Global population growth, box by box" is a good way to see the pattern.</p>`},
{id:'stork',title:'Case study: wood storks and people',html:`
<p>The wood stork case study asks you to visualize wood stork population declines and connect them to wetland loss and human population growth. The wood stork depends on wetlands that dry down in a predictable pattern to concentrate fish. When wetlands are drained for development and agriculture, the nesting colonies suffer.</p>
<p>The guiding question: <b>To what extent can an exponentially growing human population realistically coexist with wildlife in an urbanized landscape?</b> A strong answer uses specific evidence: wetland loss (Chapter 8), habitat fragmentation and HIPPO (Chapter 5), carrying capacity, and the {{ecological footprint}} (Chapter 1).</p>`}
],

sections:[
{id:'dist',title:'Why water matters and where it is',html:`
<p>Over 70% of Earth\'s surface is covered by water, humans are about 66% water, and every organism requires it. And yet:</p>
<div class="co key"><h4>The problem</h4><p>Oceans hold 97.4% of all water. Only 2.6% is fresh, and about 80% of that is locked in ice caps. Only 0.3% of freshwater is in rivers and lakes. The issue is not total water but <b>usable freshwater</b>.</p></div>
<div data-widget="freshwater"></div>
<p>Other sources divide the water slightly differently: ice on land about 1.7% of all water, groundwater about 0.8%, rivers and lakes about 0.007%, and the atmosphere about 0.001%. The message is identical: the water we can easily reach is a tiny fraction.</p>
<p>Human water consumption has risen steeply over the last 200 years, a trend that follows population growth and industrialization.</p>`},
{id:'props',title:'Properties of water',html:`
<p>H<sub>2</sub>O is a remarkable molecule. Water is highly mobile, a good solvent, freezes at 0 \u00B0C and boils at 100 \u00B0C, and is essential to life. Most of its special behavior comes from {{polarity}}: the molecule has a slightly positive end and a slightly negative end, so water molecules attract each other through {{hydrogen bonds}}.</p>
<ul><li>{{Cohesion}}: water molecules stick to each other (surface tension, droplets).</li><li><b>Adhesion:</b> water molecules stick to other surfaces.</li><li><b>High specific heat:</b> water resists temperature change when it absorbs or releases heat. It stores large amounts of energy, which moderates climate and keeps coastal temperatures mild.</li><li><b>High heat of vaporization:</b> evaporating water absorbs a lot of heat, which is why sweating cools you.</li></ul>
<div class="co watch"><h4>Common mistake</h4><p>A hydrogen bond is not a bond <i>inside</i> a water molecule. It is the attraction <i>between</i> a slightly positive hydrogen on one molecule and a slightly negative oxygen on another. These bonds are important because they give water cohesion, surface tension, high heat capacity, and its ability to dissolve many substances.</p></div>`},
{id:'cycle',title:'The hydrologic cycle, groundwater, and watersheds',html:`
<p>The {{hydrologic cycle}} moves water among oceans, atmosphere, land, ice, and living things through evaporation, transpiration, condensation, precipitation, runoff, and infiltration. It is driven by solar energy. Remember that precipitation influences net primary production.</p>
<h3>Underground water</h3>
<ul><li>{{Groundwater}}: water that exists beneath Earth\'s surface.</li><li>{{Water table}}: the upper level of groundwater, the top of the zone of saturation.</li><li>{{Aquifer}}: a porous layer of sand, gravel, or bedrock that holds underground water. It stores and transmits water.</li></ul>
<p>Rain infiltrates permeable ground, moves down to the aquifer, and flows laterally; impermeable layers block downward movement.</p>
<h3>Watersheds</h3>
<p>A {{watershed}} is all the land that drains into a particular body of water, bounded by dividing ridges. What happens anywhere in the watershed affects the water at the bottom.</p>
<div class="co local"><h4>New York watersheds</h4><p>Lecture examples include the Onondaga Lake watershed, the Kettle Lakes watershed, and the Catskills (West of Hudson) watershed that supplies drinking water to the New York City region.</p></div>`},
{id:'wet',title:'Wetlands',html:`
<p>Until recently wetlands were considered worthless and were drained for development and agriculture. In the U.S., more than 58,000 acres per year are lost to urban development, agriculture, silviculture, and rural development. Florida was once about 50% wetlands (south Florida about 75%), and today about 66% of Florida\'s wetlands have been drained or filled.</p>
<p>What we now know:</p>
<ul><li>Wetlands prevent flooding.</li><li>They improve water quality.</li><li>They provide habitat, vital to many endangered or threatened species (recall the wood stork).</li><li>They are essential nursery grounds for fish and other fauna.</li></ul>
<p>Montezuma National Wildlife Refuge, in the Finger Lakes region of New York, is a nearby example.</p>`},
{id:'dams',title:'Dams: pros and cons',html:`
<div class="cols"><div class="col pro"><h4>Pros</h4><ul><li>Downstream flooding is reduced</li><li>Water available for year-round irrigation</li><li>Clean, cheap energy source</li><li>Recreation</li><li>Lower evaporative losses (as listed in lecture)</li></ul></div>
<div class="col con"><h4>Cons</h4><ul><li>Flooded land upstream displaces people and cropland</li><li>Nutrient-rich silt does not move downstream</li><li>Disrupts fish spawning and migration</li></ul></div></div>
<p>The Three Gorges Dam in China is the large-scale example discussed in class.</p>`},
{id:'poll',title:'Water pollution',html:`
<div class="tw"><table><tr><th>{{Point source}}</th><th>{{Nonpoint source}}</th></tr>
<tr><td>Discharged at a single, identifiable location (pipe, ditch, drain)</td><td>Discharged from large, dispersed, non-specific locations (runoff of sediments, fertilizer, pesticides)</td></tr>
<tr><td>Easier to trace and regulate</td><td>Harder to trace; prevention must happen across a whole area</td></tr></table></div>
<h3>Sewage and fertilizer</h3>
<p>Sewage is waste matter carried off by sewers and drains. In cities, wastewater from homes, factories, and storm runoff flows through sewer pipes to treatment plants. About 1,200 U.S. cities use <b>combined</b> sewers for storm water and sewage for economic reasons, which can cause trouble: in heavy rain, the system can overflow ({{combined sewer overflows}}, CSOs) and release untreated sewage. Chapter 11 covers treatment.</p>
<p>Excess nutrients (nitrogen and phosphorus) from sewage and fertilizer cause {{eutrophication}}: algae bloom, die, and are decomposed by bacteria that use up the water\'s oxygen, which kills fish. Dinoflagellates such as <i>Pfiesteria</i> appear to thrive in nutrient-rich water and release neurotoxins that create lesions on fish and cause neurological problems for fishermen.</p>
<div class="co case"><h4>Case study: Onondaga Lake</h4><p><b>Causes:</b> over a century of industrial waste (mercury, PCBs, benzene) from the Solvay Process Company/Honeywell, municipal sewage, and nutrient loading (phosphorus and nitrogen).</p><p><b>Key sources:</b> Solvay waste beds, contaminated groundwater, combined sewer overflows, and Tully Valley mudboils.</p><p><b>Response:</b> major remediation, including dredging and capping, has significantly improved water quality.</p></div>`},
{id:'you',title:'What you can do',html:`
<h3>Reduce water pollution</h3>
<ul><li>Compost food wastes.</li><li>Use manure or compost instead of inorganic fertilizer; use integrated pest management instead of chemical pesticides.</li><li>Grow some of your own food using organic methods and drip irrigation.</li><li>Never apply fertilizer or pesticide near a body of water.</li><li>Use low-phosphate or phosphate-free detergents and soaps.</li><li>Clean up spills of oil, antifreeze, and brake fluid.</li><li>Use less harmful household cleaners (for example, vinegar for many surfaces).</li><li>Never pour medicines, pesticides, paint, solvents, oil, or antifreeze down the drain or onto the ground.</li></ul>
<p>Eliminating phosphate-containing detergent can reduce phosphorus loads to septic systems by 40 to 50 percent.</p>
<h3>Reduce water waste</h3>
<ul><li>Install water-saving showerheads, aerators, and toilets (6 liters or 1.6 gallons per flush or less).</li><li>Fix leaks promptly.</li><li>Turn off the tap while brushing, shaving, or washing.</li><li>Run washing machines and dishwashers only with full loads.</li><li>Keep a bottle of water in the fridge instead of running the tap for cold water.</li><li>Wash the car with a bucket, using the hose only to rinse.</li><li>Water lawns in the morning or evening, not in midday heat or wind. Use drip irrigation, mulch, and native plants.</li><li>Take short showers rather than baths.</li></ul>`}
],

CH.push({
id:'ch09',num:9,period:2,weeks:'Week 9',
title:'Food Resources',short:'Food',
blurb:'Where our food comes from, what our bodies need, why hunger persists, and whether the Green Revolution and GMOs can feed the world sustainably.',
objectives:[
 'Describe the hidden inputs in the global food system.',
 'Define a {{calorie}} and differentiate {{undernourishment}}, {{overnourishment}}, and {{malnourishment}}.',
 'Explain Malthus\'s argument about population and food.',

sections:[
{id:'system',title:'Where does our food come from?',html:`
<p>A meal is the end of a long chain. Ingredients are sourced globally, travel through international supply chains, and can be disrupted by a problem anywhere along the way. Behind every item on the shelf are:</p>
<ul><li><b>Processing:</b> many foods are assembled from ingredients and additives, not just grown.</li><li><b>Energy and transport:</b> shipping, refrigeration, and storage add a large footprint.</li><li><b>Packaging:</b> plastics, paper, and the waste they create.</li><li><b>Water and land inputs:</b> irrigation, fertilizer, and soil impacts upstream.</li><li><b>People and labor:</b> who grows and makes the food, in what conditions, and how fairly.</li><li><b>Traceability and transparency:</b> can we track where it came from, or is it opaque?</li></ul>
<h3>Food safety</h3>
<p>Long supply chains create safety risks. A well-known example is the milk powder contaminated with melamine (which gives a false positive on protein tests) that sickened about 300,000 children in China in 2008 and kept resurfacing in dairy products afterward. The lesson: safety depends on oversight of the whole chain.</p>
<div class="co key"><h4>Uneven distribution</h4><p>In the photo project <i>Hungry Planet</i>, families from around the world pose with a week of food. One family in Chad ate about $1.23 worth in a week; a German family ate more than $500 worth. Food exists, but not equally.</p></div>`},
{id:'nutrition',title:'Nutrition and calories',html:`
<p>A {{calorie}} is a measure of energy: one calorie is the energy needed to raise the temperature of 1 gram of water by 1 \u00B0C. Food energy is measured in kilocalories (1,000 calories, written Calories with a capital C). A small, non-active person may need about 2,000 Calories a day; a person doing hard physical labor may need about 4,000.</p>
<p>In food, energy comes mainly from carbohydrates, with the general formula C<sub>x</sub>(H<sub>2</sub>O)<sub>y</sub>. There are two types: simple <b>sugars</b> such as glucose and fructose (C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>) and complex <b>starches</b>.</p>
<h3>Three different problems</h3>
<div class="tw"><table><tr><th>Condition</th><th>What it means</th></tr>
<tr><td>{{Undernourishment}}</td><td>Calorie intake is below what is needed for size and occupation (about 90% or less of the recommended amount).</td></tr>
<tr><td>{{Overnourishment}}</td><td>Calorie intake is higher than recommended.</td></tr>
<tr><td>{{Malnourishment}}</td><td>A key dietary nutrient is missing (protein, a vitamin, a mineral, fatty acids), even if calories are adequate.</td></tr></table></div>
<p>In developing countries, malnutrition and undernourishment are major obstacles to further development. Hunger reduces workforce productivity and health, which limits economic growth, which keeps resources scarce: a poverty cycle.</p>`},
{id:'malthus',title:'Malthus and the Green Revolution',html:`
<h3>Thomas Malthus</h3>
<p>In his <i>Essay on the Principle of Population</i> (1798), Malthus argued that human population increases <b>exponentially</b> while food production increases only <b>linearly</b>. Eventually there would be more people than Earth could feed, leading to famine, disease, and war. He was reacting to what he saw as declining living conditions in 19th-century England.</p>
<h3>The Green Revolution</h3>
<p>The {{Green Revolution}} greatly raised crop yields through inorganic fertilizers, pesticides, mechanization, irrigation, and new high-yield "miracle" strains.</p>
<div class="cols"><div class="col pro"><h4>Benefits</h4><ul><li>Much greater productivity on less land</li><li>Fed a larger population than Malthus foresaw</li></ul></div>
<div class="col con"><h4>Costs</h4><ul><li>Pollution and erosion</li><li>Declining soil quality</li><li>Heavy water use</li><li>Reduced biodiversity</li><li>More pests and disease on dense monocultures</li><li>High fossil fuel use for machinery, planting, harvesting, and transport</li></ul></div></div>
<div class="co key"><h4>Think people, planet, profit</h4><p>To what extent is this system sustainable? Apply the triple bottom line from Chapter 1: does it protect the environment, support social well-being, and sustain the economy, all at once?</p></div>`},
{id:'gmo',title:'GMOs, fisheries, and debates',html:`
<p>The proposed "next Green Revolution" uses {{transgenic crops}}, plants into which a gene from another organism has been artificially inserted (for example, Bt corn contains a bacterial gene that makes its own insecticide). They are often called {{GMOs}}. In a sense all crops are genetically modified by domestication and breeding over thousands of years; transgenic methods are different because they can move genes across unrelated species.</p>
<ul><li>Should GMOs be labeled? Why or why not?</li><li>How far should humans go to feed the population? When, if ever, is it acceptable to alter the genes of organisms?</li></ul>
<h3>Fisheries and the commons</h3>
<ul><li>{{Aquaculture}} is fish farming.</li><li>{{Bycatch}} is the unwanted catch (other fish, turtles, dolphins) caught alongside the target species.</li><li>The {{tragedy of the commons}} is the depletion of a shared resource because each user gains by taking more while the cost is spread among everyone. Open-ocean fisheries are the classic example.</li></ul>
<p>Be ready to argue both sides on questions such as whether animals should be cloned for food and whether factory farming should be the optimal way to feed humanity. Practice presenting the strongest case for each position before deciding where you land.</p>`},
{id:'wicked',title:'Applying it: a government\'s wicked problem',html:`
<p>Imagine you are the government of a developing nation. Food links to every cabinet area:</p>
<ul><li><b>State:</b> citizen happiness and relations with neighboring countries.</li><li><b>Energy and Transportation:</b> energy supply and getting food to people.</li><li><b>Health and Education:</b> nutrition, health, schooling, and housing.</li><li><b>Environment and Natural Resources:</b> water, forests, minerals, and fossil fuels.</li><li><b>Culture, Tourism, and Economy:</b> GDP, income, and cultural preservation.</li></ul>
<p>This is a {{wicked problem}}: a social, economic, and environmental tangle with no simple fix. Hunger lowers productivity, which slows economic growth, which leaves less to spend on food and health. Breaking the cycle means acting on several fronts at once.</p>
<div class="co key"><h4>Concepts to use in an answer</h4><p>Food packaging and transportation, food safety, calories and caloric intake, undernourishment, malnourishment, overnourishment, the poverty and hunger cycle, Malthus, the Green Revolution, and GMOs. Always connect ecological, social, and economic dimensions.</p></div>`}
],

sections:[
{id:'values',title:'Values and where they come from',html:`
<p>Before reading anyone else\'s ethic, look at your own. What do you mean by <b>values</b>? What or who informs your ethics: family, culture, religion, education, time outdoors? Your answers shape how you respond to environmental questions, because the same facts can lead to different decisions when people hold different values.</p>`},
{id:'two',title:'Two perspectives',html:`
<div class="cols"><div class="col con"><h4>Humans as masters</h4><p>"Humans are masters of the land community, not members of it." Land is property and a resource. Its value lies in what it provides us.</p></div>
<div class="col pro"><h4>Humans as members</h4><p>"Humans are members of the land community, not masters of it." People are one part of a larger community and share responsibility for its health.</p></div></div>
<p>Consider where you stand on the first statement (agree, disagree, or unsure) and be ready to give reasons. A strong position acknowledges the best argument on the other side.</p>`},
{id:'leopold',title:'Aldo Leopold\'s land ethic',html:`
<p>Aldo Leopold, a forester and ecologist, argued that ethics has expanded over time to include more of the community, and that the next step is to include the land itself. In his view:</p>
<ul><li>Humans are not separate from nature. We are members of a larger {{land community}} that includes <b>soils, waters, plants, and animals</b>.</li>
<li>A {{land ethic}} asks people to move from being <b>conquerors</b> of the land to being <b>respectful citizens</b> of it, with responsibility for its health.</li>
<li>Ethical care for the environment grows from <b>connection</b>: people are more likely to protect what they can see, feel, understand, and value.</li></ul>
<div class="co key"><h4>Land as community, not just property</h4><p>If land is only property, we ask what we can get from it. If land is a community, we also ask what we owe it. That change in question changes how we treat soil (as a living system, not dirt), water (as a shared lifeline, not a dumping ground), and plants and animals (as fellow members, not merely resources).</p></div>`},
{id:'apply',title:'Connecting the land ethic to this course',html:`
<p>Look back through earlier chapters with a land ethic in mind:</p>
<ul><li>{{Environmental sustainability}} (Chapter 1) is a land ethic expressed in policy: resources available for other organisms and future generations.</li>
<li>The Florida panther and wood stork cases (Chapters 4 and 7) show what happens when people treat habitat as property to be developed rather than community to belong to.</li>
<li>Biodiversity\'s existence value (Chapter 5) is an ethical argument: something can matter even if it is never useful to us.</li>
<li>Water, food, and waste (Chapters 8, 9, 11) all ask how a member of the community should consume.</li></ul>
<p>Leopold suggests ethics needs a personal connection to nature. Spending time outdoors, learning the names of the places you live, and understanding how they work all build the connection that motivates care.</p>`}
],

id:'ch11',num:11,period:2,weeks:'Week 10',
title:'Waste Disposal and Reduction',short:'Waste',
blurb:'What happens to what we flush and what we throw away, and why reducing consumption beats every other option.',
objectives:[
 'Compare septic systems, urban wastewater treatment, and wastewater gardens.',
 'Describe the {{materials economy}} and explain why it conflicts with sustainability.',
 'Distinguish solid waste from {{hazardous waste}} and list the disposal options.',
 'Explain how {{sanitary landfills}}, {{waste-to-energy}}, {{bioremediation}}, and {{phytoremediation}} work.',
 'Rank the waste hierarchy and justify why reducing consumption is most effective.'
],
sections:[
{id:'ww',title:'Wastewater',html:`
<blockquote style="margin:1rem 0;padding-left:1rem;border-left:4px solid var(--gold)">Sewage is a wonderful, untapped resource. It has been treated as a toxic substance to get rid of, when really it is a valuable commodity.<br><small>Mark Nelson, Ecological Wastewater Treatment Systems</small></blockquote>
<h3>Septic systems (rural areas)</h3>
<p>A {{septic system}} lets wastewater separate in a buried tank: lighter material floats as a <b>scum layer</b>, heavier material sinks as a <b>sludge layer</b>, and relatively clear water in the middle flows out to a <b>drain field</b> of perforated pipes in gravel, where soil slowly absorbs and filters it. Pump the tank every 3 to 5 years to avoid thousands of dollars in drain-field replacement.</p>
<h3>Urban wastewater treatment</h3>
<div data-widget="order" data-name="ww" data-title="Order the treatment stages" data-sub="Put the stages of a municipal plant in sequence."></div>
<ul><li>{{Primary treatment}}: screens and settling remove solids for disposal (incinerate or landfill); chlorination if no further treatment.</li><li>{{Secondary treatment}}: bacteria digest organic material and nutrients.</li><li>{{Tertiary treatment}}: chemical treatment removes phosphorus and nitrogen, filter beds may be added, and chlorine kills the remaining bacteria.</li></ul>
<p>{{Sludge}}, the solid part of sewage, mostly goes to landfills but can be converted to fertilizer. Decomposers in wastewater use up oxygen; the amount they use is the {{biochemical oxygen demand}} (BOD). Lower BOD means less harm to receiving waters.</p>
<h3>Simple actions that help</h3>
<ul><li>Phosphate-free detergent reduces eutrophication and cuts phosphorus loads to septic systems by 40 to 50 percent.</li><li>Skipping the garbage disposal reduces solids, nutrients, and BOD, and reduces septic pumping.</li><li>Composting and vermiculture (worm composting) keep food waste out of the sewer and the landfill.</li></ul>`},
{id:'garden',title:'Working with nature: wastewater gardens and Living Machines',html:`
<p>A {{wastewater garden}} sends sewage from a sealed septic tank into a lined, gravel-filled wetland cell below the surface. Plants pump air to their roots, supporting aerobic bacteria that break down wastes, so there is no odor and no human contact.</p>
<div class="cols"><div class="col pro"><h4>Pros</h4><ul><li>Cheap to build</li><li>Plants are fertilized by decomposition products</li><li>Plants absorb and store toxic metals</li><li>Some plants kill pathogens</li><li>Root-zone bacteria and fungi break down some toxic organics such as PCBs</li><li>Treated water can irrigate</li><li>Products can be sold</li><li>Operating costs similar to a treatment plant</li></ul></div>
<div class="col con"><h4>Cons</h4><ul><li>Can be overloaded with phosphates and nitrates</li><li>May need a lot of space</li><li>Toxic metals accumulate in plants and must be disposed of properly</li></ul></div></div>
<div class="co case"><h4>Living Machine at Corkscrew Swamp</h4><p>A "Living Machine" treats waste with sunlight, bacteria, green plants, and animals. Designed for Corkscrew Swamp Sanctuary, it would take only about 70 by 70 feet, use no chemical additives, and recycle about 90% of the water back into the restrooms, at lower cost than conventional technology. It mimics a natural wetland: half engineered artifact, half wild nature.</p></div>`},
{id:'solid',title:'Solid waste and the materials economy',html:`
<p>Most of our products follow a <b>linear lifecycle</b> in a {{materials economy}}: extract raw materials, manufacture, use briefly, throw away. Many products are designed for {{planned obsolescence}}. For example, an estimated 125 million cell phones were discarded in 2005, about 65,000 tons of waste. Throwing away one bag of trash also means roughly seven more bags were produced upstream making the goods.</p>
<p>In the lecture chart, U.S. solid waste production divides roughly as 97.5% from goods and service production, 1.5% sewage, and 1.0% municipal garbage. Municipal trash is small compared with the waste hidden in making things.</p>
<h3>Hazardous waste</h3>
<p>{{Hazardous waste}} has at least one of four characteristics:</p>
<ul><li><b>Ignitable:</b> catches fire easily.</li><li><b>Corrosive:</b> corrodes metals in storage tanks or equipment.</li><li><b>Reactive:</b> chemically unstable and readily reacts with other compounds.</li><li><b>Toxic:</b> harmful to human health.</li></ul>`},
{id:'disp',title:'Disposal options',html:`
<table><tr><th>Non-hazardous solid waste</th><th>Hazardous waste</th></tr><tr><td>Sanitary landfills<br>Waste-to-energy facilities</td><td>Bioremediation<br>Phytoremediation<br>Incineration<br>Land disposal (deep wells, impoundments, special landfills)<br>Export to other countries</td></tr></table>
<h3>Modern sanitary landfill</h3>
<p>A {{sanitary landfill}} has a liner, probes to detect leaks, treatment of {{leachate}} (liquid that drains through the waste), and capture of methane for energy.</p>
<div class="cols"><div class="col pro"><h4>Advantages</h4><ul><li>Plenty of space</li><li>Low cost</li><li>Handles large amounts</li><li>Filled land can be reused</li></ul></div><div class="col con"><h4>Disadvantages</h4><ul><li>Noise, dust, traffic</li><li>Groundwater contamination risk</li><li>Air pollution from toxic gases</li><li>Release of CH<sub>4</sub> and CO<sub>2</sub></li></ul></div></div>
<p>Organic waste is the main problem in landfills: it makes methane (a greenhouse gas) and acidic leachate that can carry toxins into water. Composting keeps it out at far lower environmental and economic cost than incineration.</p>
<h3>Biological cleanup</h3>
<ul><li>{{Bioremediation}}: microorganisms digest an organic compound and release CO<sub>2</sub> and H<sub>2</sub>O. Effective for gasoline, diesel, oil, PCBs, organic solvents, and pesticides. <b>Not effective</b> for toxic metals, concentrated chemical wastes, or complex chemical mixtures.</li><li>{{Phytoremediation}}: plants take up or break down contaminants, such as the metal storage in wastewater garden plants.</li></ul>
<h3>Waste-to-energy</h3>
<p>{{Waste-to-energy}} (WTE) facilities burn non-recyclable trash to generate power. The Onondaga County facility operates under one of the strictest WTE air permits in the country and reports consistently good emissions and ash test results.</p>`},
{id:'3r',title:'The waste hierarchy and the Story of Stuff',html:`
<p>The best way to handle waste is not to make it. Order these from most to least preferred:</p>
<div data-widget="order" data-name="waste" data-title="Rank the waste hierarchy" data-sub="Most preferred first."></div>
<p>Questions to ask before you buy:</p>
<ul><li><b>Use:</b> do I really need it? Will it last? Is the packaging necessary?</li><li><b>Reuse:</b> can I buy it used or rent it? Is it easy and cheap to repair?</li><li><b>Recycle:</b> is it recyclable or compostable, and how much post-consumer recycled content does it have?</li></ul>
<div class="co key"><h4>Why reduce comes first</h4><p>Reducing consumption avoids extraction, manufacturing, transport, and disposal all at once, so it saves energy, water, and materials upstream as well as waste downstream. Recycling helps, but it still uses energy and is only part of the cycle. <i>The Story of Stuff</i> argues that our linear, materials-based economy is inconsistent with the definition of environmental sustainability.</p></div>`}
],

blurb:'How chemicals we design for convenience travel through food chains into our own bodies, and how the environment shapes the spread of disease.',
objectives:[

 'Differentiate {{bioaccumulation}} from {{biomagnification}} and trace a {{persistent organic pollutant}} up a food chain.',
