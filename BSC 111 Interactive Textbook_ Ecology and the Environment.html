sections:[
{id:'tox',title:'Toxins in the environment',html:`
<p>"Birds are good indicators of environmental problems, but amphibians are even better at the local level. Birds can fly away, but frogs must face the problem," said biologist David Wake. This chapter\'s guiding question: <b>how do the synthetic chemicals we design for convenience and safety (coolants, pesticides, flame retardants) unintentionally travel through the food chain to affect human health?</b></p>
<h3>Organic chemicals</h3>
<p>In chemistry, {{organic chemicals}} are compounds containing carbon atoms along with hydrogen, oxygen, nitrogen, sulfur, phosphorus, chlorine, or fluorine. (CO<sub>2</sub> and CO are exceptions and are considered inorganic.) Examples: hydrocarbons such as methane (CH<sub>4</sub>); sugars and starches such as glucose; and <b>halogenated hydrocarbons</b> such as DDT (insecticide), PCBs, PBDEs, and CFCs.</p>
<table><tr><th>Chemical</th><th>Uses</th><th>Concern</th></tr>
<tr><td>{{PBDEs}} (polybrominated diphenyl ethers)</td><td>Fire retardants in computers, televisions, plastics, furniture</td><td>Endocrine disruptor</td></tr>
<tr><td>{{PCBs}} (polychlorinated biphenyls)</td><td>Insulating, nonflammable coolants and lubricants in transformers and capacitors; manufacture banned in 1976</td><td>Endocrine disruptor; persistent</td></tr>
<tr><td>DDT</td><td>Insecticide</td><td>Persistent; moves through food webs</td></tr></table>
<p>Halogenated hydrocarbons resist breaking down. That persistence is the reason they were useful, and the reason they are a problem.</p>`},
{id:'magnify',title:'Bioaccumulation and biomagnification',html:`
<ul><li>{{Bioaccumulation}}: a toxin builds up to higher-than-normal levels in an <b>individual organism\'s</b> tissues over time, because it is stored in fat faster than it is eliminated.</li>
<li>{{Biomagnification}}: concentrations increase at <b>higher trophic levels</b> of a food web.</li></ul>
<p>As energy moves up the pyramid, total biomass gets smaller, but contaminants become <b>more concentrated</b> in top predators. A predator must eat huge numbers of prey to get enough energy, and it inherits the lifetime toxic load of each one.</p>
<div data-widget="biomag"></div>
<h3>The trophic path of a synthetic toxin</h3>
<table><tr><th>Stage</th><th>Process</th><th>Result</th></tr>
<tr><td>Consumer product</td><td>Leaching or off-gassing</td><td>Toxins enter air, water, or dust</td></tr>
<tr><td>Primary producer</td><td>Absorption</td><td>Toxins enter the base of the ecosystem</td></tr>
<tr><td>Secondary consumer</td><td>Bioaccumulation</td><td>Tissues store increasing levels</td></tr>
<tr><td>Top predator or human</td><td>Biomagnification</td><td>Highest concentrations lead to chronic health problems or death</td></tr></table>
<div class="co key"><h4>Why this matters to people</h4><p>Humans are top predators. We take in concentrated toxins through food such as fish or by direct exposure. Many persistent chemicals act as <b>endocrine disruptors</b>, interfering with hormones and reproduction, decades after they were manufactured.</p></div>`},
{id:'cat',title:'Case study: Operation Cat Drop',html:`
<p>In the 1950s the World Health Organization sprayed the insecticide DDT in Borneo to fight a public health crisis (malaria). It killed mosquitoes, but it triggered a chain reaction that ended with the Royal Air Force parachuting live cats into the jungle. Rebuild the "domino effect" in order:</p>
<div data-widget="order" data-name="cat" data-title="Operation Cat Drop" data-sub="Place the 14 events in chronological order."></div>
<div class="co key"><h4>Lessons</h4><ul><li>Toxicology is not about one substance hitting one target. It is about how chemicals persist and move through the energy flow of a food chain.</li><li>The abiotic factor (DDT spray) triggered a {{trophic cascade}} involving wasps, caterpillars, lizards, cats, and rats.</li><li>A chemical designed to save lives nearly caused a different catastrophe by moving through invisible links of the ecosystem.</li></ul></div>`},
{id:'risk',title:'Toxicology, risk, and regulation',html:`
<p>Toxicology asks what makes a substance toxic. Key ideas:</p>
<ul><li><b>Kinds of toxic agents:</b> carcinogens (cause cancer), mutagens (cause genetic mutations), teratogens (cause birth defects), allergens, neurotoxins (damage nervous systems), and endocrine disruptors.</li>
<li>{{Dose-response}} analysis measures how effect changes with dose: <b>LD50</b> is the dose that kills 50% of test animals, <b>ED50</b> the dose that produces an effect in 50%, and a <b>threshold</b> is the dose below which no effect is seen.</li>
<li><b>Acute vs chronic exposure:</b> a single large dose versus long-term low-level exposure. <b>Synergistic effects</b> occur when two agents together are worse than the sum of each.</li>
<li><b>Epidemiological studies</b> look for patterns of disease in human populations.</li></ul>
<h3>Managing risk</h3>
<p>Risk assessment estimates how likely harm is; risk management decides what to do. Two philosophies:</p>
<ul><li><b>Innocent until proven guilty:</b> a chemical is allowed until evidence shows harm.</li><li>The {{precautionary principle}}: when there are credible signs of serious harm, act to prevent it even without final proof; the burden is on those introducing the chemical.</li></ul>
<p>Rules exist at local, national, and international levels.</p>`},
{id:'bio',title:'Biological hazards and dengue',html:`
<p>Not all hazards are synthetic. {{Biological hazards}} include:</p>
<ul><li><b>Pathogens:</b> bacteria, viruses, fungi, and parasites causing diseases such as malaria, influenza, and salmonella.</li><li><b>Toxigenic and allergenic agents:</b> microbes that make toxins (mycotoxins) and allergens such as pollen, mold, and venom.</li><li><b>Zoonotic diseases:</b> transmissible between animals and humans, such as rabies and avian influenza.</li></ul>
<p>Impacts reach well beyond illness: disease outbreaks, large healthcare costs, and damage to ecosystems. Effective protection is multi-sectoral: hygiene and sanitation, vaccination, continuous disease surveillance, and environmental management (vector and waste control).</p>
<div class="co case"><h4>Dengue case study</h4><p>Heavy rain, drainage problems, standing water, and homes without screens raise mosquito exposure and dengue risk in vulnerable communities. Dengue is both an ecological and a public health problem. Prevention means mosquito habitat reduction, community action, and a broader health response.</p></div>
<h3>Ecological principles in the dengue case</h3>
<ul><li><b>Trophic levels and energy flow</b></li><li><b>Niche and habitat:</b> drainage canals and discarded containers act as artificial habitats where mosquitoes thrive.</li><li><b>Population dynamics and carrying capacity:</b> increased rainfall lets mosquitoes "breed up worse than ever before."</li><li><b>Abiotic vs biotic factors:</b> rain intensity and gravel roads (abiotic) interacting with reeds and humans (biotic).</li><li><b>Trophic cascades</b>, as in Borneo.</li><li>Poverty combined with limited resources makes it all worse.</li></ul>`},
{id:'board',title:'Apply it: the Health Advisory Board',html:`
<p>You advise the president of a small South Pacific island nation with few resources. A mosquito-borne outbreak is sickening people, and the mosquito has an indirect feeding interaction with the sole pollinator of your main food crop. The rules: <b>no chemicals or pesticides</b>, solve everything <b>within the island</b>, and you have <b>no economic resources</b>. Build a plan and say how you will measure success.</p>
<div class="co key"><h4>Debrief: what a strong plan uses</h4><ul><li><b>Ecological anchors:</b> human-modified landscapes (canals, yards, containers) create artificial habitats that grow mosquito populations.</li><li><b>The chemical dilemma:</b> fogging and oiling are quick fixes but risk trophic cascades that can destroy pollinators and food security (think Borneo).</li><li><b>Systems thinking:</b> manage abiotic factors (stagnant water, trash) to cut biotic hazards (virus-carrying vectors) without costly or toxic inputs.</li></ul></div>
<p>Measures of success might include the number of standing-water sites eliminated, mosquito counts, case numbers, and pollinator abundance.</p>`}
],

objectives:[

sections:[
{id:'atm',title:'The atmosphere and its pollutants',html:`
<p>Air is about 78% nitrogen, 21% oxygen, and 1% other gases. An {{atmospheric pollutant}} is any substance, human-made or natural, in the air that can injure health, harm the environment, or damage property.</p>
<ul><li>{{Primary pollutants}} are hazardous as emitted, directly from the source (soot, carbon monoxide).</li><li>{{Secondary pollutants}} are formed by chemical reactions in the atmosphere (tropospheric ozone, sulfuric acid).</li></ul>
<h3>Common pollutants from combustion</h3>
<ul><li><b>NO<sub>x</sub></b> (nitrogen oxides) and <b>SO<sub>x</sub></b> (sulfur oxides)</li><li><b>CO<sub>2</sub></b>, <b>CO</b>, and <b>CH<sub>4</sub></b></li><li>{{VOCs}} (volatile organic compounds)</li><li>{{Particulate matter}}: suspended solid particles and droplets (aerosols, soot)</li></ul>`},
{id:'smog',title:'Smog and thermal inversions',html:`
<div class="tw"><table><tr><th>{{Photochemical smog}}</th><th>{{Industrial smog}}</th></tr>
<tr><td>Brown-air smog</td><td>Gray-air smog</td></tr>
<tr><td>Forms under sunlight, often on still, sunny summer days in big cities</td><td>Comes from burning fossil fuels (especially coal)</td></tr>
<tr><td>Mix of primary and secondary pollutants: nitrogen dioxide (amber-orange) plus VOCs react to make tropospheric ozone</td><td>Mix of SO<sub>x</sub>, sulfuric acid, and particulates (soot, aerosols)</td></tr>
<tr><td>A problem where traffic is heavy and sunlight strong</td><td>A problem where pollution control is inadequate</td></tr></table></div>
<p>Most factory and power plant smokestacks remove most pollutants with <b>scrubbers</b>. It is a case of "pay now or pay later": pay for scrubbers or pay for a pulmonologist. Tall stacks, the "dilution solution," reduce local pollution but increase regional pollution downwind.</p>
<h3>Thermal inversion</h3>
<p>Normally air cools with height, so warm surface air rises and carries pollutants up and away. In a {{thermal inversion}}, a layer of warm air lies over cooler air near the ground. The cool air is trapped, and pollutants cannot rise and disperse. Valleys such as Utah\'s Salt Lake Valley are especially prone.</p>
<figure class="fig"><svg viewBox="0 0 420 210" width="420" role="img" aria-label="Diagram of a thermal inversion: a warm air layer above a cool air layer near the ground, trapping pollution">
<rect x="10" y="10" width="400" height="80" fill="color-mix(in srgb,#E07B39 35%,transparent)"/><text x="210" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Warm air layer (acts like a lid)</text>
<rect x="10" y="90" width="400" height="90" fill="color-mix(in srgb,#27688A 30%,transparent)"/><text x="210" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Cool air with trapped pollutants</text>
<path d="M60 175 L110 150 L160 175 Z M260 175 L310 145 L360 175 Z" fill="var(--ink2)"/>
<g stroke="var(--bad)" stroke-width="2.5" fill="none"><path d="M205 170 V105"/><path d="M198 112 L205 103 L212 112"/><path d="M230 170 V120"/></g>
<text x="210" y="82" text-anchor="middle" font-size="12" fill="var(--ink)">pollutants cannot rise past the warm layer</text>
<text x="210" y="200" text-anchor="middle" font-size="12" fill="var(--ink2)">Ground</text></svg><figcaption>Warm air over cool air blocks normal vertical mixing.</figcaption></figure>
<h3>Ground-level ozone</h3>
<p>{{Tropospheric ozone}} is the primary component of photochemical smog and can damage living tissue (and crops and ecosystems). Concentrations vary across places and times. Remember: ozone is <b>good up high, bad nearby</b> (Chapter 15 covers the stratospheric layer). Smog causes coughing, breathing problems, eye, nose, and throat irritation, aggravates asthma, emphysema, and heart disease, and lowers resistance to disease.</p>`},
{id:'acid',title:'Acid deposition',html:`
<p>Acids donate protons (H<sup>+</sup>) to water, forming hydronium; bases accept protons (or donate hydroxide). Acidity is measured by <b>pH</b> on a logarithmic scale, so each whole number is a tenfold change in hydrogen ion concentration.</p>
<div data-widget="ph"></div>
<h3>Where acid-forming pollutants come from</h3>
<ul><li>About 50% are sulfur pollutants, mainly from industry and power plants.</li><li>Nitrogen compounds make up about 20 to 25% of the total, and about half of those come from transportation.</li></ul>
<p>U.S. emissions of sulfur and nitrogen pollutants fell after the Clean Air Act (1963) and the tougher Clean Air Act (1970).</p>
<h3>How it forms and falls</h3>
<p>In the air, sulfur dioxide and nitrogen dioxide react with oxygen and water:</p>
<div class="co math"><h4>Reactions</h4><p>SO<sub>2</sub> + \u00BDO<sub>2</sub> + H<sub>2</sub>O \u2192 H<sub>2</sub>SO<sub>4</sub> (sulfuric acid)</p><p>2NO<sub>2</sub> + \u00BDO<sub>2</sub> + H<sub>2</sub>O \u2192 2HNO<sub>3</sub> (nitric acid)</p></div>
<ul><li>{{Wet deposition}}: acids fall as rain, snow, fog, or cloud water.</li><li>{{Dry deposition}}: dry acidic particles and gases settle on surfaces.</li></ul>
<p>Together they make up {{acid deposition}}. The terms describe how the acid is delivered, not whether the surface is wet.</p>
<p>{{Buffering capacity}} is the ability of soil or water to minimize changes in acidity when acid is added. Two places can receive equal acid rain, but the one with better buffering (for example, limestone-rich soil) keeps a higher pH and stays healthier.</p>
<div class="co local"><h4>Case study: the Adirondacks</h4><p>New York is downwind of many industrial areas and the large concentration of coal-burning power plants in the Ohio River Valley. In 1996, Ohio power plants produced six times more sulfur dioxide and eight times more nitrogen oxides than New York plants. Adirondack soils and bedrock cannot buffer the extra acid, so lakes and streams suffer fish kills and lower biodiversity. New York works with the EPA to reduce deposition.</p></div>`},
{id:'fix',title:'Solutions for outdoor air pollution',html:`
<h3>Industrial and power sources</h3>
<ul><li><b>Prevention:</b> use low-sulfur coal, remove sulfur from coal, shift to cleaner fuels.</li><li><b>Dispersion or cleanup:</b> tall smokestacks (which only move the problem), removing pollutants after combustion, and taxing pollution.</li></ul>
<h3>Vehicles</h3>
<ul><li><b>Prevention:</b> mass transit, bicycles, and walking; cleaner engines and fuels; higher fuel efficiency; tax breaks for low-emission cars; restricting driving in polluted areas.</li><li><b>Cleanup:</b> emission control devices and stricter exhaust inspection standards.</li></ul>
<div class="co key"><h4>Key idea</h4><p>Prevention is usually cheaper and more effective than cleanup. Dispersion is the weakest option because it moves pollution rather than removing it.</p></div>`},
{id:'indoor',title:'Indoor air pollution',html:`
<p>Indoor air can be more polluted than outdoor air, even in large industrial cities. People spend about <b>90% of their time indoors</b>, and those most exposed (the young, the elderly, the chronically ill) are often the most vulnerable. Several sources add together, and inadequate ventilation, high temperature, and high humidity make matters worse.</p>
<h3>Major indoor pollutants in developed countries</h3>
<ul><li>Tobacco smoke</li><li>Formaldehyde (from pressed wood, glues, some household products), asbestos, and lead</li><li>{{Radon-222}} and carbon monoxide</li><li>Very small fine and ultrafine particles</li><li>Biological contaminants: mold, pollen, and dust mites</li><li>Household products and pesticides</li></ul>
<p><b>Dust mites</b> feed on skin and dust in bedding, furniture, and carpet and can trigger asthma and allergies. <b>Mold</b> is controlled by controlling moisture; it causes allergic reactions and respiratory problems. {{Sick building syndrome}} refers to health complaints linked to time spent in a building that have no single clear cause, often tied to poor ventilation and indoor contaminants.</p>
<div class="co case"><h4>Case study: radon</h4><p>{{Radon-222}} is a colorless, odorless, radioactive gas released as uranium and radium in soil and rock break down. It seeps into buildings through cracks, floor drains, and foundations, and it can build up indoors to many times outdoor levels. It increases the risk of lung cancer and is the second leading cause of lung cancer. Test your home, in New York and elsewhere.</p></div>
<h3>The toll</h3>
<p>Air pollution prematurely kills about 3 million people each year, mostly from indoor pollution in developing countries. The EPA estimates 150,000 to 350,000 deaths a year in the U.S. from indoor and outdoor air pollution combined, and more than 125,000 Americans a year get cancer from breathing diesel fumes.</p>
<h3>What you can do indoors</h3>
<ul><li>Test for radon and formaldehyde; fix problems.</li><li>Avoid furniture and products containing formaldehyde.</li><li>Take shoes off at the door to cut dust, lead, and pesticide inputs.</li><li>Test for asbestos in buildings built before 1980.</li><li>Do not store gasoline, solvents, or volatile chemicals inside a home or attached garage.</li><li>If you smoke, do it outdoors.</li><li>Make sure stoves, fireplaces, and heaters are properly installed, vented, and maintained.</li><li>Install carbon monoxide detectors near sleeping areas.</li></ul>`}
],

sections:[
{id:'big',title:'The big picture',html:`
<p><b>Energy</b> is the capacity to do work. Energy resources fall into two groups:</p>
<ul><li>{{Nonrenewable energy}}: exists in fixed amounts and is renewed only by geological, physical, or chemical processes that take millions to billions of years. According to the course slides, over 90% of U.S. energy comes from nonrenewable sources.</li>
<li>{{Renewable energy}}: replenished fairly rapidly (hours to decades) through natural processes. Less than 10% of U.S. energy, per the course slides.</li></ul>
<p>Be ready to say how <b>perpetual</b>, <b>renewable</b>, and <b>nonrenewable</b> differ. A perpetual source, like sunlight, will last as long as the Sun does regardless of human use. A renewable one can be replenished on human timescales but can be overused (biofuels, wood, geothermal heat fields). A nonrenewable one is effectively used up once consumed.</p>
<div data-widget="classify"></div>`},
{id:'five',title:'Five considerations for every energy decision',html:`
<p>Use the same five lenses for every resource. They are the structure of the debate and a ready-made study frame:</p>
<div class="tw"><table><tr><th>Lens</th><th>Ask yourself</th></tr>
<tr><td><b>T</b> Perpetual vs. renewable vs. nonrenewable</td><td>How fast does it replenish? Can it run out?</td></tr>
<tr><td><b>A</b> Availability limitations</td><td>Where is it? How much is there? Does it need sun, wind, or a geological site?</td></tr>
<tr><td><b>E</b> Economic viability</td><td>What do construction, fuel, maintenance, storage, and technology cost? Are there incentives and jobs?</td></tr>
<tr><td><b>V</b> Environmental impacts</td><td>Emissions, land and habitat, water, wildlife, wastes, mining, spills.</td></tr>
<tr><td><b>S</b> Socio-political impacts</td><td>Safety, security, weapons risk, public acceptance, rural economies, jobs, food prices.</td></tr></table></div>
<div class="co watch"><h4>Common mistake</h4><p>Do not list only emissions. A strong answer covers all five lenses. A resource that is clean can still be limited by where it is available (geothermal, solar) or by cost (solar up-front cost, nuclear).</p></div>`},
{id:'explore',title:'Compare the resources',html:`
<p>Pick any two resources and filter by factor. This uses the pros and cons presented in lecture, tagged to the five lenses. The tags are a study aid; some points could fit more than one lens.</p>
<div data-widget="energy"></div>`},
{id:'all',title:'All eight resource profiles',html:`
<p>The full list from lecture, one resource at a time. Open each to review the pros and cons.</p>
<div data-widget="energyAll"></div>
<p><b>Solar types:</b> <b>passive</b> solar heating is simple and conserves energy and cost (building design and orientation); <b>active</b> solar uses collectors and panels to heat water or air and to produce electricity. <b>Biofuel types:</b> combustion for heat or electricity (wood, charcoal, manure, solid and liquid wastes, crop wastes) and auto fuels (plant-derived ethanol and biodiesel).</p>`},
{id:'real',title:'Why real-world choices are messy',html:`
<p>No resource scores best on all five lenses. Patterns to notice:</p>
<ul><li><b>Cheap and available can be dirty.</b> Coal and petroleum have infrastructure in place, but extraction, emissions, and "unsustainable" count against them.</li>
<li><b>Clean can be costly or limited.</b> Solar has no emissions and no fuel but a high up-front cost and a need for sun; geothermal needs a suitable site.</li>
<li><b>Low carbon is not the same as low risk.</b> Nuclear is free of atmospheric pollution but raises accident, waste, expense, and weapons concerns.</li>
<li><b>"Renewable" is not automatically sustainable.</b> Biofuels can raise food costs and cause monoculture problems.</li>
<li><b>Energy choices cross into society.</b> Rural economies, jobs, visual and noise effects, and national security all enter the decision.</li></ul>
<div class="co key"><h4>Debate prep checklist</h4><p>For your assigned resource and side (advantages or disadvantages): make a bulleted list that touches all five lenses, lead with your strongest two or three points, expect the other side\'s best counter, and have a response ready. You get up to three minutes to present and four to debate.</p></div>`}

CH.push({
id:'ch15',num:15,period:2,weeks:'Week 13',
title:'Climate, Climate Change, and the Ozone Layer',short:'Climate and ozone',
blurb:'How Earth\'s climate system works, what drives it naturally, how human greenhouse gases are changing it, and how the ozone hole story differs from global warming.',
objectives:[
 'Distinguish {{weather}} from {{climate}} and describe the climate of Central New York.',
 'Explain what causes seasons, the role of ocean circulation, and the three {{Milankovitch cycles}}.',
 'Explain the {{greenhouse effect}}, name the major {{greenhouse gases}}, and identify human sources.',
 'Describe how scientists study past and future climate (ice cores, the Keeling Curve, models, the {{IPCC}}).',
 'Summarize projected impacts of climate change.',
 'Explain how stratospheric ozone forms and is destroyed, why CFCs create the ozone hole, and why that is not the same as global warming.'
],
sections:[
{id:'system',title:'The climate system',html:`
<p>The climate system is the interaction of Earth\'s spheres (the atmosphere, oceans, ice, living things, and solid Earth), connected by the biogeochemical cycles from Chapter 3. In the carbon cycle, for example, carbon moves among near-surface reservoirs: the ocean, the atmosphere, living and dead organisms, and rocks.</p>
<h3>Weather versus climate</h3>
<ul><li>{{Weather}}: short-term conditions of the atmosphere in a place, hour to hour and day to day.</li><li>{{Climate}}: the long-term average, prevailing weather in a region over many years.</li></ul>
<div class="co watch"><h4>Common mistake</h4><p>A cold day does not disprove global warming, and a hot day does not prove it. Single days are weather. Climate is the pattern over decades.</p></div>
<div class="co local"><h4>Regional climates</h4><p><b>Central New York</b> (Syracuse, about 43\u00B0N) has a humid continental climate with four distinct seasons and heavy snowfall (over 100 inches a year). New York City is humid subtropical, with hot, humid summers and moderately cold winters. <b>Southern Florida</b> has a savanna (dry tropical) climate with alternating wet and dry seasons and monthly averages above 18 \u00B0C (64 \u00B0F); the rest of Florida is humid subtropical.</p></div>`},
{id:'controls',title:'What controls climate',html:`
<ul><li><b>Seasons</b> come from the tilt of Earth\'s axis relative to its orbit around the Sun. The hemisphere tilted toward the Sun has summer; the other has winter.</li>
<li><b>Atmosphere and ocean coupling:</b> air circulation drives wind and weather, and atmospheric circulation drives ocean circulation.</li>
<li>{{Thermohaline circulation}}: differences in seawater density, from temperature and salinity, drive surface and deep-water circulation (the global "conveyor belt"). It helps maintain regional climates.</li>
<li><b>Natural drivers of change:</b> changes in the shape of Earth\'s orbit, the tilt and wobble of Earth\'s axis, changes in solar output, and volcanic activity.</li></ul>
<h3>Milankovitch cycles</h3>
<p>Milutin Milanković proposed that long-term climate swings, including ice ages and warm interglacial periods, follow regular cycles in Earth\'s orbit. They redistribute sunlight across the planet and seasons and set the pacing of major shifts. Interglacial periods occur roughly every 100,000 years.</p>
<table><tr><th>Cycle</th><th>What changes</th><th>Period</th></tr>
<tr><td>Eccentricity</td><td>Shape of Earth\'s orbit around the Sun</td><td>About 100,000 years</td></tr>
<tr><td>Obliquity</td><td>Tilt of Earth\'s axis (about 22 to 25 degrees; more tilt means more severe seasons)</td><td>About 41,000 years</td></tr>
<tr><td>Precession</td><td>Wobble of Earth\'s axis (shifts the timing of the seasons)</td><td>About 23,000 years</td></tr></table>`},
{id:'ghe',title:'The greenhouse effect and greenhouse gases',html:`
<p>Sunlight arrives as <b>short-wave radiation</b>. Earth absorbs it, warms, and re-emits energy as <b>long-wave (infrared) radiation</b>. {{Greenhouse gases}} absorb some of that outgoing long-wave energy and radiate it back, warming the lower atmosphere. This natural {{greenhouse effect}} keeps Earth livable; the concern is that humans are strengthening it.</p>
<figure class="fig"><svg viewBox="0 0 420 240" width="420" role="img" aria-label="Short-wave sunlight arrives at Earth, long-wave radiation leaves, and greenhouse gases return some of it to the surface">
<rect x="10" y="190" width="400" height="40" fill="color-mix(in srgb,var(--brand2) 45%,transparent)"/><text x="210" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Earth\'s surface</text>
<rect x="10" y="80" width="400" height="36" fill="color-mix(in srgb,var(--gold) 30%,transparent)"/><text x="360" y="103" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">greenhouse gases</text>
<g stroke="#E0A020" stroke-width="3" fill="none"><path d="M80 10 L120 185"/><path d="M110 170 L120 187 L128 168"/></g>
<text x="40" y="40" font-size="12" font-weight="700" fill="var(--ink)">Short-wave</text><text x="40" y="54" font-size="12" fill="var(--ink)">sunlight in</text>
<g stroke="var(--bad)" stroke-width="3" fill="none"><path d="M250 185 L250 20"/><path d="M243 30 L250 18 L257 30"/><path d="M300 185 L300 108"/><path d="M290 150 L300 185"/></g>
<path d="M300 112 C 320 130, 330 150, 322 184" stroke="var(--bad)" stroke-width="3" fill="none" stroke-dasharray="5 4"/>
<text x="262" y="30" font-size="12" font-weight="700" fill="var(--ink)">Long-wave out</text>
<text x="330" y="150" font-size="11" fill="var(--ink)">re-radiated back</text></svg><figcaption>Some outgoing long-wave energy escapes; some is trapped and returned to the surface.</figcaption></figure>
<p>Major greenhouse gases: <b>water vapor</b>, <b>ozone (O<sub>3</sub>)</b>, <b>carbon dioxide (CO<sub>2</sub>)</b>, <b>nitrous oxide (N<sub>2</sub>O)</b>, <b>methane (CH<sub>4</sub>)</b>, and <b>halocarbons</b> including CFCs.</p>
<h3>Human sources</h3>
<ul><li><b>Fossil fuel use</b> for heating, cooling, transportation, electricity, and industry is the largest source of added CO<sub>2</sub>.</li><li><b>Deforestation and land-use change</b> add CO<sub>2</sub> and reduce the planet\'s capacity to store carbon. Over the last 150 years, roughly a quarter of the increase in atmospheric CO<sub>2</sub> has come from land-use change.</li></ul>
<p>Atmospheric CO<sub>2</sub> has been tracked since the 1950s in the {{Keeling Curve}}, which shows a steady upward trend with a seasonal wiggle as northern forests grow and rest.</p>`},
{id:'evidence',title:'How scientists know',html:`
<ul><li><b>Instrumental record:</b> direct measurements start around the 1860s.</li>
<li><b>Ice cores:</b> as snow compacts into ice on Greenland and Antarctica, air bubbles are trapped, so scientists can measure past CO<sub>2</sub> directly, going back hundreds of thousands of years. Ratios of heavy to light isotopes (oxygen-18 to oxygen-16 and hydrogen-2 to hydrogen-1) in the ice give clues about past temperature. Ancient ice records history in its bubbles.</li>
<li><b>Models:</b> future climate is predicted with computer models. They have errors from input data and model accuracy, but they have steadily improved. The IPCC runs many models and reports the range of results; all of them predict rapid warming, with varying uncertainty.</li>
<li>The {{IPCC}} (Intergovernmental Panel on Climate Change), established in 1988, gives independent scientific advice by assessing scientific, technical, and socio-economic information, and by reporting impacts and options for adaptation and mitigation. It links climate change to rising greenhouse gases.</li></ul>
<div class="co key"><h4>Key idea</h4><p>Earth\'s climate has always changed, for natural reasons that are predictable. The question is whether present change fits those natural patterns. The ice-core and instrumental records, together with models that need human greenhouse gas emissions to match observed warming, support the conclusion that most recent warming is human-caused.</p></div>`},
{id:'impacts',title:'Projected impacts',html:`
<p>The numbers below come from the IPCC-era figures shown in lecture; check current assessments for the latest values.</p>
<ul><li><b>Sea level:</b> rose by just under 20 cm between 1870 and 2001 (about 1.7 mm per year in the 20th century), and the rate has increased (about 3.1 mm per year from 1993 to 2006). For the Gulf of Mexico, lecture shows a projected rise of 15 to 40 inches (37 to 100 cm) by 2100. A melted Greenland ice sheet would raise seas by about 5 m and drown much of South Florida.</li>
<li><b>Precipitation:</b> more frequent heavy rainfall events with longer dry periods between. Most coastal areas drier; uplands could be wetter or drier.</li>
<li><b>Hurricanes:</b> more intense storms are likely, but the change in frequency is uncertain. Higher seas make storm surge worse regardless.</li>
<li><b>Human health:</b> more heat-related deaths; more ground-level ozone; expanded habitat of disease-carrying insects (malaria and dengue); more marine-borne illness and harmful algal blooms.</li>
<li><b>Plants:</b> in experiments, elevated CO<sub>2</sub> raised tree photosynthesis by about 50% and growth by about 20%, but benefits are limited by nutrients, water, and other stresses.</li></ul>
<p>Responses fall into two groups: <b>mitigation</b> (reduce emissions and increase sinks) and <b>adaptation</b> (prepare for changes already under way).</p>`},
{id:'ozone',title:'The ozone layer is a different problem',html:`
<p>Ozone is <b>good up high, bad nearby</b>. In the stratosphere (peak concentration around 25 km), the {{ozone layer}} shields life from the Sun\'s ultraviolet (UV) radiation. At ground level, ozone is a pollutant (Chapter 13).</p>
<h3>Natural balance</h3>
<div class="co math"><h4>Reactions</h4><p><b>Made:</b> O<sub>2</sub> + O \u2192 O<sub>3</sub></p><p><b>Destroyed naturally:</b> O<sub>3</sub> + UV \u2192 O<sub>2</sub> + O; O<sub>3</sub> + O \u2192 2 O<sub>2</sub>; O<sub>3</sub> + O<sub>3</sub> \u2192 3 O<sub>2</sub></p></div>
<p>Normally, production equals natural destruction.</p>
<h3>How CFCs break the balance</h3>
<ol><li>{{CFCs}} are human-made compounds used as refrigerants (Freon), spray can propellants, and in Styrofoam. They are long-lived, stable, nontoxic, and nonflammable, which is why they spread so widely.</li>
<li>In Antarctic winter darkness, the <b>polar vortex</b> isolates very cold air, and <b>polar stratospheric clouds</b> form.</li>
<li>CFC by-products break down on cloud crystals into chlorine molecules (Cl<sub>2</sub>).</li>
<li>When sunlight returns in polar spring, it splits Cl<sub>2</sub> into chlorine atoms.</li>
<li>Each chlorine atom acts as a <b>catalyst</b>, converting O<sub>3</sub> into O<sub>2</sub> over and over, so a few chlorine atoms destroy many ozone molecules.</li></ol>
<p>Ozone is measured in Dobson Units. Average ozone is about 300 DU, a layer 3 mm thick if compressed. The Antarctic "hole" drops to about 100 DU on average, and 220 DU is used as the boundary of the ozone-loss region. The 1987 <b>Montreal Protocol</b> (with tightening in 1990 and 1992) phased out ozone-depleting substances.</p>
<h3>Consequences of ozone loss</h3>
<ul><li>More skin cancer (UV damages DNA), cataracts, and sunburn. The three major skin cancers are basal cell carcinoma, squamous cell carcinoma, and melanoma.</li><li>Suppressed immune systems.</li><li>Harm to crops and animals and reduced growth of ocean phytoplankton.</li><li>Faster breakdown of materials.</li></ul>
<div class="co watch"><h4>Is the ozone hole causing global warming?</h4><p><b>No.</b> They are separate problems. Ozone is itself a greenhouse gas, so less stratospheric ozone traps <i>less</i> heat, not more. The ozone hole is caused by CFCs and UV chemistry; global warming is caused mainly by CO<sub>2</sub> and other greenhouse gases. (Some CFCs are also greenhouse gases, which links the two only weakly.)</p></div>`}
],

 {q:'Milankovitch cycles explain long-term climate variation mainly by changes in:',o:['Volcanic eruption frequency','Ocean salinity','Earth\'s orbital shape, tilt, and wobble','Human greenhouse gas emissions'],a:2,w:'Eccentricity, obliquity, and precession change how sunlight is distributed.'},
 {q:'What is a key role of the IPCC?',o:['Controlling global carbon emissions directly','Running multiple climate models and assessing the range of climate responses','Setting national climate policy','Measuring ocean salinity from ships'],a:1,w:'The IPCC assesses and synthesizes science; it does not set policy.'},
 {q:'Match the Milankovitch cycle to its period: obliquity (axis tilt) is about:',o:['100,000 years','41,000 years','23,000 years','5,000 years'],a:1,w:'Eccentricity is about 100,000, obliquity about 41,000, and precession about 23,000 years.'},
 {q:'What is the relationship between the ozone hole and global warming?',o:['The ozone hole is the main cause of global warming','They are separate problems; ozone is a greenhouse gas, so less ozone traps less heat','The ozone hole cools the entire Earth to ice age levels','There is no ozone in the atmosphere'],a:1,w:'The ozone hole comes from CFC chemistry; global warming comes mainly from CO2 and other greenhouse gases.'},
 {q:'Why do CFCs destroy so much ozone?',o:['They are toxic to people','Chlorine atoms released from them act as catalysts, destroying many ozone molecules each','They make oxygen heavier','They block UV from reaching ozone'],a:1,w:'A catalyst is not used up, so each chlorine atom can destroy many O3 molecules.'},
 {q:'Which is NOT listed among the consequences of the ozone hole?',o:['More skin cancer and cataracts','Suppressed immune systems','Reduced ocean phytoplankton growth','Increased stratospheric ozone'],a:3,w:'The ozone hole means less ozone, not more.'}
],

],

</script>
<script>
(function(){
'use strict';
var CH=window.CH, ORD=window.ORD;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function strip(h){return h.replace(/<[^>]+>/g,' ').replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,function(m,a,b){return b||a}).replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim()}

/* ---------- storage (localStorage when available, memory otherwise) ---------- */
var KEY='bsc111-textbook-v1';
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==='object'?v:{}}catch(e){return {}}}
var db=load();
['read','quiz','cards','notes'].forEach(function(k){db[k]=db[k]||{}});
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},150)}

/* ---------- glossary ---------- */
var GL={};
CH.forEach(function(c){c.terms.forEach(function(t){GL[t[0].toLowerCase()]={term:t[0],def:t[1],ch:c.id}})});
function mk(s){
  return s.replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,function(m,k,d){
    var key=k.trim().toLowerCase();
    if(!GL[key]&&GL[key.replace(/s$/,'')]) key=key.replace(/s$/,'');
    if(!GL[key]&&GL[key.replace(/es$/,'')]) key=key.replace(/es$/,'');
    if(!GL[key]) return d||k;
    return '<button class="t" type="button" data-k="'+esc(key)+'">'+(d||k)+'</button>';
  });
}

/* ---------- stable answer-order shuffle (same order on every visit, so saved answers stay valid) ---------- */
(function(){
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var num=/^[\d.,%\s]+(years?)?$/;
  CH.forEach(function(c){c.quiz.forEach(function(q,i){
    if(q.o.every(function(o){return num.test(o)}))return;
    var r=rng(hash(c.id+':'+i)),idx=q.o.map(function(_,k){return k}),correct=q.o[q.a];
    for(var k=idx.length-1;k>0;k--){var j=Math.floor(r()*(k+1));var t=idx[k];idx[k]=idx[j];idx[j]=t}
    q.o=idx.map(function(k){return q.o[k]});q.a=q.o.indexOf(correct);
  })});
})();

/* ---------- helpers ---------- */
function chById(id){return CH.filter(function(c){return c.id===id})[0]}
function secKey(c,s){return c.id+'/'+s.id}
function chProgress(c){
  var tot=c.sections.length+c.quiz.length, done=0;
  c.sections.forEach(function(s){if(db.read[secKey(c,s)])done++});
  var qa=(db.quiz[c.id]||{}).a||{}; done+=Object.keys(qa).length;
  return tot?Math.round(done/tot*100):0;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var app=$('#app');

/* ---------- theme ---------- */
var themes=['auto','light','dark'];
function applyTheme(){
  var t=db.theme||'auto', r=document.documentElement;
  if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
  $('#themeBtn').textContent=t==='auto'?'Auto':t==='light'?'Light':'Dark';
}
$('#themeBtn').addEventListener('click',function(){db.theme=themes[(themes.indexOf(db.theme||'auto')+1)%3];save();applyTheme()});
applyTheme();

/* ---------- rail ---------- */
function renderRail(active){
  var h='<h2>Study tools</h2><div class="tools">'+
   [['#/review','Exam review'],['#/cards','Flashcards'],['#/glossary','Glossary'],['#/notes','My notes']].map(function(t){
     return '<a href="'+t[0]+'" class="'+(active===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('')+'</div>';
  var groups=[[1,'Weeks 2 to 7, through Exam 1'],[2,'Weeks 8 to 13, Exam 2 material']];
  groups.forEach(function(g){
    h+='<h2>'+g[1]+'</h2><ol class="trail">';
    CH.filter(function(c){return c.period===g[0]}).forEach(function(c){
      var p=chProgress(c);
      h+='<li><a href="#/ch/'+c.id+'" class="'+(active==='#/ch/'+c.id?'on':'')+'"><span class="node'+(p>=100?' full':'')+'" style="--p:'+p+'"><b>'+c.num+'</b></span><span>'+esc(c.short||c.title)+'<small>'+esc(c.weeks)+'</small></span></a></li>';
    });
    h+='</ol>';
  });
  $('#rail').innerHTML=h;
}

/* ---------- term card ---------- */
var tc=$('#termcard');
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button.t');
  if(b){
    var g=GL[b.getAttribute('data-k')]; if(!g)return;
    tc.innerHTML='<b>'+esc(g.term)+'</b><p>'+mk(esc(g.def))+'</p><button type="button" data-x="1">Close</button><button type="button" data-go="'+g.ch+'">Open chapter</button>';
    tc.hidden=false; return;
  }
  if(e.target.getAttribute&&e.target.getAttribute('data-x')){tc.hidden=true;return}
  if(e.target.getAttribute&&e.target.getAttribute('data-go')){tc.hidden=true;location.hash='#/ch/'+e.target.getAttribute('data-go');return}
  if(!tc.hidden&&!e.target.closest('#termcard')) tc.hidden=true;
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){tc.hidden=true;document.body.classList.remove('open')}});

/* ---------- mobile drawer ---------- */
$('#menuBtn').addEventListener('click',function(){document.body.classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',document.body.classList.contains('open'))});
$('#scrim').addEventListener('click',function(){document.body.classList.remove('open')});

/* ---------- views ---------- */
function daysTo(y,m,d){var t=new Date(y,m-1,d,0,0,0),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-n)/864e5)}
function examChip(name,y,m,d,label){
  var n=daysTo(y,m,d);
  if(n<0) return '';
  return '<span class="exam"><b>'+name+'</b> '+label+', '+(n===0?'today':n===1?'tomorrow':'in '+n+' days')+'</span>';
}

function viewHome(){
  var next=null;
  CH.forEach(function(c){if(!next&&chProgress(c)<100)next=c});
  var last=db.last&&chById(db.last);
  var cont=last&&chProgress(last)<100?last:next;
  var h='<div class="wide"><section class="hero"><h1>Ecology and the Environment</h1>'+
   '<p class="lede">A study guide built from the BSC 111 lectures. Read a chapter, test yourself, then use the exam review and flashcards to lock it in. Your progress and notes are saved in this browser.</p>'+
   '<div class="row">'+(cont?'<a class="btn" href="#/ch/'+cont.id+'">'+(chProgress(cont)>0?'Continue':'Start')+' Chapter '+cont.num+'</a>':'')+
   '<a class="btn ghost" href="#/review">Exam review quiz</a><a class="btn ghost" href="#/cards">Flashcards</a></div>'+
   '<div class="chipsrow">'+examChip('Exam 1',2026,10,7,'Wednesday, Oct 7')+examChip('Exam 2',2026,12,2,'Wednesday, Dec 2')+'</div></section>';
  [[1,'Weeks 2 to 7: material through Exam 1'],[2,'Weeks 8 to 13: material for Exam 2']].forEach(function(g){
    h+='<h2>'+g[1]+'</h2><div class="grid">';
    CH.filter(function(c){return c.period===g[0]}).forEach(function(c){
      var p=chProgress(c);
      h+='<a class="tile" href="#/ch/'+c.id+'"><span class="wk">Chapter '+c.num+', '+esc(c.weeks)+'</span><h3>'+esc(c.title)+'</h3><p>'+esc(strip(c.blurb)).slice(0,120)+(strip(c.blurb).length>120?'...':'')+'</p><div class="meter" role="img" aria-label="'+p+' percent complete"><i style="width:'+p+'%"></i></div></a>';
    });
    h+='</div>';
  });
  h+='<h2>Course learning outcomes</h2><ul class="outcomes">'+
   ['Use the scientific method to explain the basics of ecology and how the natural world works.',
    'Describe current environmental issues, their causes and solutions.',
    'Explain the tenets of environmental literacy and apply them to everyday life.',
    'Use critical thinking, ecology, and environmental knowledge to decide which human activities are unsustainable and move toward sustainability.',
    'Describe the connections between social justice and environmental issues.',
    'Use mathematics to analyze environmental problems.'].map(function(o){return '<li>'+o+'</li>'}).join('')+'</ul>'+
   '<footer class="foot">Built from the BSC 111-01 lecture slides and syllabus (Fall 2026). Course materials are for your personal use in this class; see "Using Course Materials" in the syllabus. The syllabus and your instructor are the final word on exam coverage and policies.</footer></div>';
  app.innerHTML=h; renderRail('#/');
}

function viewChapter(id,anchor){
  var c=chById(id); if(!c){location.hash='#/';return}
  db.last=id; save();
  var i=CH.indexOf(c), prev=CH[i-1], next=CH[i+1];
  var h='<div class="wrap"><article class="chapter"><header class="ch-head"><p class="ch-wk">Chapter '+c.num+', '+esc(c.weeks)+'</p><h1>'+esc(c.title)+'</h1><p class="lede">'+mk(c.blurb)+'</p>'+
   '<div class="obj"><h2>By the end of this chapter you should be able to</h2><ul>'+c.objectives.map(function(o){return '<li>'+mk(o)+'</li>'}).join('')+'</ul></div>'+
   '<nav class="jump" aria-label="In this chapter">'+c.sections.map(function(s){return '<a href="#/ch/'+c.id+'/'+s.id+'">'+esc(s.title)+'</a>'}).join('')+
   '<a href="#/ch/'+c.id+'/terms">Key terms</a><a href="#/ch/'+c.id+'/check">Check yourself</a><a href="#/ch/'+c.id+'/reflect">Reflect</a></nav></header>';
  c.sections.forEach(function(s){
    var k=secKey(c,s);
    h+='<section class="sec" id="'+s.id+'"><h2>'+esc(s.title)+'</h2><div class="prose">'+mk(s.html)+'</div><div class="sec-foot"><button type="button" class="done" data-sec="'+k+'" aria-pressed="'+(db.read[k]?'true':'false')+'">'+(db.read[k]?'Read':'Mark as read')+'</button></div></section>';
  });
  h+='<section class="sec" id="terms"><h2>Key terms</h2><p>Open a term to check yourself. Then practice them as flashcards.</p><div class="terms">'+
   c.terms.map(function(t){return '<details><summary>'+esc(t[0])+'</summary><p>'+mk(esc(t[1]))+'</p></details>'}).join('')+'</div><div class="row"><a class="btn sm" href="#/cards/'+c.id+'">Flashcards for this chapter</a></div></section>';
  h+='<section class="sec" id="check"><h2>Check yourself</h2><p>Choose an answer to see feedback right away. Your answers are saved.</p><div id="quizHost"></div></section>';
  h+='<section class="sec" id="reflect"><h2>Reflect and write</h2><p>Writing is how ideas stick. Your answers stay on this device; copy them from the My notes page.</p>'+
   c.reflect.map(function(p,n){var nk=c.id+'/'+n;return '<div class="prompt"><label for="n-'+c.id+n+'">'+mk(p)+'</label><textarea id="n-'+c.id+n+'" data-note="'+nk+'">'+esc(db.notes[nk]||'')+'</textarea><span class="saved" aria-live="polite"></span></div>'}).join('')+'</section>';
  h+='<section class="sec sumbox"><div class="co key"><h4>Chapter summary</h4><ul>'+c.summary.map(function(s){return '<li>'+mk(s)+'</li>'}).join('')+'</ul></div></section>';
  h+='<nav class="pn" aria-label="Chapter navigation">'+(prev?'<a href="#/ch/'+prev.id+'"><small>Previous</small>'+esc(prev.title)+'</a>':'<span></span>')+(next?'<a class="r" href="#/ch/'+next.id+'"><small>Next</small>'+esc(next.title)+'</a>':'<a class="r" href="#/review"><small>Finished the chapters?</small>Take the exam review</a>')+'</nav></article></div>';
  app.innerHTML=h;
  renderRail('#/ch/'+id);
  quiz($('#quizHost'),c.quiz,{store:c.id});
  $$('[data-widget]',app).forEach(initWidget);
  if(anchor){var el=document.getElementById(anchor);if(el)el.scrollIntoView()}
}

/* mark read + notes autosave (delegated) */
app.addEventListener('click',function(e){
  var b=e.target.closest('.done');
  if(b){
    var k=b.getAttribute('data-sec'); if(db.read[k]) delete db.read[k]; else db.read[k]=1;
    save(); b.setAttribute('aria-pressed',db.read[k]?'true':'false'); b.textContent=db.read[k]?'Read':'Mark as read';
    renderRail('#/ch/'+db.last);
  }
});
var noteT={};
app.addEventListener('input',function(e){
  var t=e.target; if(!t.getAttribute||!t.getAttribute('data-note'))return;
  var k=t.getAttribute('data-note'); db.notes[k]=t.value; if(!t.value.trim()) delete db.notes[k];
  save(); var s=t.parentNode.querySelector('.saved'); if(s){s.textContent='Saved';clearTimeout(noteT[k]);noteT[k]=setTimeout(function(){s.textContent=''},1200)}
});

/* ---------- quiz component ---------- */
function quiz(host,qs,opt){
  var st=opt.store?(db.quiz[opt.store]=db.quiz[opt.store]||{a:{}}):{a:{}};
  var letters='ABCDE';
  function draw(){
    var answered=Object.keys(st.a).length, right=0;
    var h='';
    qs.forEach(function(q,i){
      var sel=st.a[i], done=sel!==undefined;
      if(done&&sel===q.a)right++;
      h+='<fieldset class="q" data-i="'+i+'"><legend>'+(i+1)+'. '+mk(q.q)+'</legend><div class="opts">';
      q.o.forEach(function(o,j){
        var cls=done?(j===q.a?' right':(j===sel?' wrong':'')):'';
        h+='<button type="button" class="opt'+cls+'" data-j="'+j+'"'+(done?' disabled':'')+'>'+letters[j]+'. '+mk(o)+'</button>';
      });
      h+='</div><div class="fb" aria-live="polite">';
      if(done) h+=(sel===q.a?'<strong>Correct.</strong> ':'<strong>Not quite.</strong> The answer is '+letters[q.a]+'. ')+mk(q.w);
      h+='</div></fieldset>';
    });
    h+='<div class="score">'+(answered?('Score so far: '+right+' of '+answered+' answered ('+qs.length+' questions)'):qs.length+' questions')+'</div><div class="meter"><i style="width:'+(answered/qs.length*100)+'%"></i></div>'+
       '<div class="row"><button type="button" class="btn ghost sm" data-reset="1">Reset this quiz</button></div>';
    host.innerHTML=h;
  }
  draw();
  host.addEventListener('click',function(e){
    var o=e.target.closest('.opt'), r=e.target.closest('[data-reset]');
    if(r){st.a={};if(opt.store)db.quiz[opt.store]=st;save();draw();if(opt.store)renderRail('#/ch/'+opt.store);return}
    if(!o||o.disabled)return;
    var i=+o.parentNode.parentNode.getAttribute('data-i');
    st.a[i]=+o.getAttribute('data-j'); if(opt.store){db.quiz[opt.store]=st;save();renderRail('#/ch/'+opt.store)}
    var y=window.scrollY; draw(); window.scrollTo(0,y);
  });
}

/* ---------- exam review ---------- */
var rv=null;
function viewReview(){
  renderRail('#/review');
  var nAll=0; CH.forEach(function(c){nAll+=c.quiz.length});
  var h='<div class="wrap"><h1>Exam review</h1><p class="lede">Mixed questions from every chapter, shuffled. Pick the material and how many questions you want. At the end you will see which chapters to revisit.</p>'+
   '<div class="wd"><h3>Build a practice set</h3><p class="sub">'+nAll+' questions are available in total.</p>'+
   '<p><b>Material</b></p><div class="chips" id="rvScope">'+
   '<button type="button" class="chip" data-v="1" aria-pressed="true">Weeks 2 to 7 (Exam 1)</button><button type="button" class="chip" data-v="2" aria-pressed="false">Weeks 8 to 13 (Exam 2)</button><button type="button" class="chip" data-v="all" aria-pressed="false">Everything</button></div>'+
   '<p><b>Number of questions</b></p><div class="chips" id="rvN"><button type="button" class="chip" data-v="10" aria-pressed="true">10</button><button type="button" class="chip" data-v="25" aria-pressed="false">25</button><button type="button" class="chip" data-v="50" aria-pressed="false">50</button><button type="button" class="chip" data-v="999" aria-pressed="false">All</button></div>'+
   '<div class="row"><button type="button" class="btn" id="rvGo">Start practice set</button></div></div><div id="rvRun"></div></div>';
  app.innerHTML=h;
  var scope='1',n='10';
  function pick(id,set){$$('#'+id+' .chip').forEach(function(b){b.addEventListener('click',function(){$$('#'+id+' .chip').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');set(b.getAttribute('data-v'))})})}
  pick('rvScope',function(v){scope=v}); pick('rvN',function(v){n=v});
  $('#rvGo').addEventListener('click',function(){
    var pool=[]; CH.forEach(function(c){if(scope==='all'||String(c.period)===scope)c.quiz.forEach(function(q){pool.push({c:c,q:q})})});
    rv={items:shuffle(pool).slice(0,+n),i:0,right:0,miss:{}};
    runReview();
  });
}
function runReview(){
  var host=$('#rvRun'), it=rv.items[rv.i], letters='ABCDE';
  if(!it){
    var pct=Math.round(rv.right/rv.items.length*100);
    var weak=Object.keys(rv.miss).sort(function(a,b){return rv.miss[b]-rv.miss[a]});
    host.innerHTML='<div class="wd"><h3>Finished: '+rv.right+' of '+rv.items.length+' ('+pct+'%)</h3>'+
      (weak.length?'<p>Chapters to revisit, most misses first:</p><ul>'+weak.map(function(id){var c=chById(id);return '<li><a href="#/ch/'+id+'">Chapter '+c.num+': '+esc(c.title)+'</a> ('+rv.miss[id]+' missed)</li>'}).join('')+'</ul>':'<p>No misses. Nicely done.</p>')+
      '<div class="row"><button type="button" class="btn" id="rvAgain">Build another set</button></div></div>';
    $('#rvAgain').addEventListener('click',viewReview); host.scrollIntoView(); return;
  }
  var q=it.q;
  host.innerHTML='<div class="wd"><div class="meter"><i style="width:'+(rv.i/rv.items.length*100)+'%"></i></div><p class="sub">Question '+(rv.i+1)+' of '+rv.items.length+', from Chapter '+it.c.num+'</p>'+
    '<fieldset class="q" style="margin:0"><legend>'+mk(q.q)+'</legend><div class="opts">'+q.o.map(function(o,j){return '<button type="button" class="opt" data-j="'+j+'">'+letters[j]+'. '+mk(o)+'</button>'}).join('')+'</div><div class="fb" aria-live="polite"></div></fieldset><div class="row" id="rvNext"></div></div>';
  host.querySelector('.opts').addEventListener('click',function(e){
    var o=e.target.closest('.opt'); if(!o||o.disabled)return;
    var j=+o.getAttribute('data-j');
    $$('.opt',host).forEach(function(b,k){b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===j)b.classList.add('wrong')});
    if(j===q.a)rv.right++; else rv.miss[it.c.id]=(rv.miss[it.c.id]||0)+1;
    $('.fb',host).innerHTML=(j===q.a?'<strong>Correct.</strong> ':'<strong>Not quite.</strong> The answer is '+letters[q.a]+'. ')+mk(q.w);
    $('#rvNext').innerHTML='<button type="button" class="btn" id="rvN2">'+(rv.i+1<rv.items.length?'Next question':'See results')+'</button>';
    $('#rvN2').focus(); $('#rvN2').addEventListener('click',function(){rv.i++;runReview()});
  });
}

/* ---------- flashcards ---------- */
var fc={deck:[],i:0,flip:false,scope:'all',only:false};
function buildDeck(){
  var d=[];
  CH.forEach(function(c){
    var ok=fc.scope==='all'||fc.scope===c.id||(fc.scope==='p1'&&c.period===1)||(fc.scope==='p2'&&c.period===2);
    if(ok)c.terms.forEach(function(t){var k=t[0].toLowerCase();if(!(fc.only&&db.cards[k]))d.push({k:k,t:t[0],d:t[1],c:c})})
  });
  fc.deck=d; fc.i=0; fc.flip=false;
}
function viewCards(scope){
  renderRail('#/cards');
  fc.scope=scope||'all'; buildDeck();
  var opts='<option value="all">All chapters</option><option value="p1">Weeks 2 to 7 (Exam 1)</option><option value="p2">Weeks 8 to 13 (Exam 2)</option>'+CH.map(function(c){return '<option value="'+c.id+'">Chapter '+c.num+': '+esc(c.short||c.title)+'</option>'}).join('');

/* ---------- search ---------- */
var IDX=null;
function buildIdx(){
  IDX=[];
  CH.forEach(function(c){
    c.sections.forEach(function(s){IDX.push({c:c,id:s.id,title:s.title,text:strip(s.html),kind:'Section'})});
    c.terms.forEach(function(t){IDX.push({c:c,id:'terms',title:t[0],text:t[1],kind:'Term'})});
  });
}
function viewSearch(q){
  renderRail('');
  if(!IDX)buildIdx();
  var toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  var res=IDX.map(function(r){
    var hay=(r.title+' '+r.text).toLowerCase(), sc=0;
    for(var i=0;i<toks.length;i++){var p=hay.indexOf(toks[i]);if(p<0)return null;sc+=1+(r.title.toLowerCase().indexOf(toks[i])>-1?5:0)+(r.kind==='Term'?2:0)}
    return {r:r,s:sc,p:hay.indexOf(toks[0])};
  }).filter(Boolean).sort(function(a,b){return b.s-a.s}).slice(0,30);
  function hl(t){return esc(t).replace(new RegExp('('+toks.map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','ig'),'<mark>$1</mark>')}
  var h='<div class="wrap"><h1>Search</h1><p class="lede">'+res.length+(res.length===30?'+':'')+' results for "'+esc(q)+'".</p>';
  if(!res.length)h+='<div class="empty">Nothing found. Try a shorter word, like "niche" or "ozone".</div>';
  res.forEach(function(x){
    var r=x.r, st=Math.max(0,x.p-60), snip=(st?'...':'')+r.text.slice(st,st+200)+'...';
    h+='<div class="res"><a href="#/ch/'+r.c.id+'/'+r.id+'">'+esc(r.title)+'</a> <span class="saved">'+r.kind+' in Chapter '+r.c.num+'</span><p>'+hl(snip)+'</p></div>';
  });
  app.innerHTML=h+'</div>';
}

function route(){
  document.body.classList.remove('open'); tc.hidden=true;
  var p=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(p[0]==='ch'&&p[1])viewChapter(p[1],p[2]);

W.isotope=function(el){

  var pre=[['Helium atom',2,2,2],['Carbon-12',6,6,6],['Carbon-13 (isotope)',6,7,6],['Sodium ion, Na+',11,12,10],['Oxygen ion, O2-',8,8,10]];

    });

  el.addEventListener('click',function(e){

    if(m){var p=+b.getAttribute('data-p'),q=m==='up'?p-1:p+1;var t=order[p];order[p]=order[q];order[q]=t;checked=false;draw();var nb=$$('[data-m="'+m+'"]',el)[q];if(nb)nb.focus()}

    var h='<div class="wd"><h3>Energy resource explorer</h3><p class="sub">Choose up to two resources to compare, then filter by the five factors from lecture. Tags: <b>T</b> type, <b>A</b> availability, <b>E</b> economics, <b>V</b> environment, <b>S</b> socio-political.</p>'+
     '<p style="margin:.2rem 0"><b>Resources</b> (pick up to two)</p><div class="chips" id="en-r">'+D.map(function(r){return '<button type="button" class="chip" data-r="'+r.id+'" aria-pressed="'+(sel.indexOf(r.id)>-1)+'">'+esc(r.name)+'</button>'}).join('')+'</div>'+
     '<p style="margin:.4rem 0 .2rem"><b>Factor</b></p><div class="chips" id="en-f">'+Object.keys(FAC).map(function(k){return '<button type="button" class="chip" data-f="'+k+'" aria-pressed="'+(fac===k)+'">'+FAC[k]+'</button>'}).join('')+'</div>';
    sel.forEach(function(id){
      var r=D.filter(function(x){return x.id===id})[0];
      h+='<h4 style="margin:1rem 0 .3rem;font-size:1.1rem">'+esc(r.name)+' <span class="tag">'+esc(r.type)+'</span></h4><div class="cols"><div class="col pro"><h4>Pros</h4>'+list(r,'pro')+'</div><div class="col con"><h4>Cons</h4>'+list(r,'con')+'</div></div>';
    });
    if(!sel.length)h+='<div class="empty" style="margin-top:.8rem">Pick a resource above.</div>';
    el.innerHTML=h+'</div>';
  }
  el.addEventListener('click',function(e){
    var r=e.target.closest('[data-r]'),f=e.target.closest('[data-f]');
    if(r){var id=r.getAttribute('data-r'),i=sel.indexOf(id);if(i>-1)sel.splice(i,1);else{sel.push(id);if(sel.length>2)sel.shift()}draw()}
    if(f){fac=f.getAttribute('data-f');draw()}
  });
  draw();
};

W.energyAll=function(el){
  var D=window.ENERGY, FAC={T:'Type',A:'Availability',E:'Economics',V:'Environment',S:'Socio-political'};
  function ul(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x[0])+'<span class="tag" title="'+FAC[x[1]]+'">'+x[1]+'</span></li>'}).join('')+'</ul>'}
  el.innerHTML='<div class="terms">'+D.map(function(r){
    return '<details><summary>'+esc(r.name)+' ('+esc(r.type)+')</summary><div class="cols" style="margin-top:.5rem"><div class="col pro"><h4>Pros</h4>'+ul(r.pros)+'</div><div class="col con"><h4>Cons</h4>'+ul(r.cons)+'</div></div></details>';
  }).join('')+'</div>';
};

W.classify=function(el){
  var items=[['Natural gas','n'],['Coal','n'],['Petroleum (crude oil)','n'],['Nuclear (uranium)','n'],['Geothermal','r'],['Solar','r'],['Wind','r'],['Biofuels','r']];
  var st={};
  function draw(){
    var score=0,h='<div class="wd"><h3>Sort the resources</h3><p class="sub">Using the lecture definitions, is each resource renewable or nonrenewable?</p><div class="bars">';
    items.forEach(function(it,i){
      var a=st[i];if(a===it[1])score++;
      h+='<div class="row" style="margin:.2rem 0"><span style="width:11rem;font:650 .92rem var(--head)">'+it[0]+'</span><button type="button" class="chip" data-i="'+i+'" data-v="r" aria-pressed="'+(a==='r')+'">Renewable</button><button type="button" class="chip" data-i="'+i+'" data-v="n" aria-pressed="'+(a==='n')+'">Nonrenewable</button>'+(a?'<span class="saved" style="font-size:.9rem;color:'+(a===it[1]?'var(--ok)':'var(--bad)')+'">'+(a===it[1]?'Correct':'Check again: '+(it[1]==='r'?'renewable':'nonrenewable'))+'</span>':'')+'</div>';
    });
    h+='</div><div class="readout">'+Object.keys(st).length+' of '+items.length+' sorted, '+score+' correct. Remember: nonrenewable means fixed amounts that take millions to billions of years to renew; renewable means replenished in hours to decades.</div></div>';
    el.innerHTML=h;
  }
  el.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;st[b.getAttribute('data-i')]=b.getAttribute('data-v');draw()});
  draw();
};

/* ---------- boot ---------- */
if(!location.hash){try{history.replaceState(null,'',location.pathname+location.search+'#/')}catch(e){location.hash='#/'}}
route();
})();

</script>
